  <div class="dialog-overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="close" id="close-dialog" aria-label="Close dialog">×</button></div><div id="dialog-content"></div></section></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    (() => {
      const clientId='feature_demo_20261005', today='2026-10-09', nextDate='2026-10-12';
      const state={workout:'planned',checkedIn:false,wellness:[4,5,3,2],concernOpen:true,concernCount:1,concernOffset:0,baseline:'ready',page:'overview',date:today,view:'wellness',messages:[]};
      const metricLabels=['Sleep','Stress','Fatigue','Soreness'];
      // Fixed fictional ratings for 24 Sep–7 Oct. The latest observation is excluded.
      const baselineRatings=[[5,2,3,2],[6,3,2,1],[5,2,3,2],[4,4,4,3],[6,2,2,2],[5,3,3,1],[5,2,3,2],[6,3,2,3],[4,4,4,2],[5,2,3,1],[6,3,2,2],[5,2,3,3],[5,3,4,2],[6,2,3,2]];
      const concernSamples=['Pressing feedback','Recovery after leg day','Session timing','Exercise substitution','Knee discomfort','Training volume question','Grip feedback','Warm-up question','Ankle mobility','Lower back feedback','Running discomfort','Equipment availability'];
      const content=document.getElementById('content'), overlay=document.getElementById('overlay');
      const locationLabel=document.getElementById('location');
      let returnFocus=null, toastTimer;
      const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const fmt=date=>new Date(date+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
      const route=(page,date=state.date,view=state.view)=>page==='overview'?`/clients/${clientId}`:page==='training'?`/clients/${clientId}/training?date=${date}`:page==='messages'?`/messages?clientId=${clientId}`:page==='report'?`/report/${clientId}`:page==='clients'?'/clients':page==='schedule'?'/schedule':page==='check-ins'?`/clients/${clientId}/check-ins?view=${view}`:`/clients/${clientId}/${page}`;
      const link=(label,page,extra='')=>`<a class="btn small" href="#${page}" data-destination="${page}" ${extra}>${label}</a>`;
      function notify(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
      function openDialog(title,body){returnFocus=document.activeElement;document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=body;overlay.hidden=false;document.getElementById('close-dialog').focus()}
      function closeDialog(){overlay.hidden=true;returnFocus?.focus()}
      function updateNavigation(){locationLabel.textContent=route(state.page);document.querySelectorAll('#client-tabs a').forEach(a=>{const active=a.dataset.destination===state.page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.querySelectorAll('[data-global]').forEach(b=>b.classList.toggle('active',b.dataset.global==='Clients'&&!['schedule','messages','report'].includes(state.page)||b.dataset.global.toLowerCase()===state.page))}
      function go(page,options={}){state.page=page;state.date=options.date||today;state.view=options.view||'wellness';render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('page-heading')?.focus({preventScroll:true})}
      function week(){return `<div class="week" aria-label="This week at a glance">${[['Mon','05','Completed','2026-10-05'],['Tue','06','No plan','2026-10-06'],['Wed','07','Completed','2026-10-07'],['Thu','08','No plan','2026-10-08'],['Today','09',state.workout==='completed'?'Completed':state.workout==='planned'?'Planned':'No plan',today],['Sat','10','No plan','2026-10-10'],['Sun','11','No plan','2026-10-11']].map(([day,n,status,date])=>`<button data-day="${date}" class="${date===today?'today':status==='Completed'?'done':''}" aria-label="${fmt(date)} · ${status}"><span>${day}</span><strong>${n}</strong><span>${status==='Completed'?'Done':status==='Planned'?'Plan':status}</span></button>`).join('')}</div>`}
      function workoutSummary(){if(state.workout==='unplanned')return `<div><h3>No workout planned</h3><p>Today · ${fmt(today)}</p></div><div class="actions"><a class="btn primary" href="#training" data-destination="training" data-date="${today}">Plan workout →</a></div>`;return `<div><h3>Upper body strength</h3><p>${state.workout==='completed'?'Completed · 48 min':'Planned · 5 exercises · about 50 min'}</p></div><div class="actions"><a class="btn ${state.workout==='planned'?'primary':''}" href="#training" data-destination="training" data-date="${today}" ${state.workout==='planned'?'data-run="true"':''}>${state.workout==='completed'?'Review workout':'Start workout'} →</a></div>`}
      function reviewItems(){return `${state.concernOpen?concernSamples.slice(state.concernOffset,state.concernOffset+state.concernCount).map((name,index)=>`<div class="review-row concern"><div><strong>${esc(name)}</strong><p>${index===0&&state.concernOffset===0?'Shoulder discomfort · 8 Oct':'Client feedback · '+(8-index%4)+' Oct'}</p></div>${index===0?'<button class="text-link" data-action="review-concern">Review →</button>':'<a class="text-link" href="#concerns" data-destination="check-ins" data-view="concerns">Review →</a>'}</div>`).join(''):''}<div class="review-row"><div><strong>Assessments</strong><p>1 baseline missing · 1 reassessment due</p></div><a class="text-link" href="#assessments" data-destination="assessments">Review →</a></div>${!state.checkedIn?'<div class="review-row"><div><strong>No check-in today</strong></div><button class="text-link" data-action="record-checkin">Record →</button></div>':''}`}
      function baselineRows(){return state.baseline==='empty'?[]:state.baseline==='collecting'?baselineRatings.slice(0,3):state.baseline==='constant'?baselineRatings.map(()=>[5,3,3,2]):baselineRatings}
      function metricStats(index){const rows=baselineRows(),n=rows.length;const mean=n?rows.reduce((sum,row)=>sum+row[index],0)/n:0;const sd=n>1?Math.sqrt(rows.reduce((sum,row)=>sum+(row[index]-mean)**2,0)/(n-1)):0;const hasLatest=state.baseline!=='empty'||state.checkedIn;const z=hasLatest&&n>=7&&sd>0?(state.wellness[index]-mean)/sd*(index===0?-1:1):null;return {n,mean,sd,z}}
      function snapshot(){const hasLatest=state.baseline!=='empty'||state.checkedIn,n=baselineRows().length;const caption=!hasLatest?'No check-ins yet. Record your first check-in.':n<7?`${n} earlier check-ins · Record ${7-n} more to build this preview baseline.`:state.baseline==='constant'?'No baseline variation yet · Z-scores are unavailable.':`${n} earlier check-ins · 24 Sep–7 Oct · Latest entry excluded`;return `<section class="card checkin"><div class="section-head"><h2>Check-in snapshot</h2><div class="actions"><button class="btn small ${!state.checkedIn?'primary':''}" data-action="record-checkin">${state.checkedIn?'Edit today’s check-in':'Record check-in'}</button>${link('View check-ins →','check-ins')}</div></div><p class="checkin-meta">${hasLatest?(state.checkedIn?'Today · Manual entry':'8 Oct · Manual entry'):'No data recorded'}</p><div class="baseline-layout"><div class="baseline-chart"><div class="chart-head"><h3>Baseline change · Z-score</h3><button class="info-button" data-action="baseline-info" aria-label="How baseline Z-scores work">i</button></div><p class="chart-caption">${caption}</p><div class="chart-direction"><span>← More favourable</span><span>Less favourable →</span></div><div role="group" aria-label="Wellness change in standard deviations from personal baseline">${metricLabels.map((label,index)=>{const {z}=metricStats(index),position=z===null?50:50+Math.max(-3,Math.min(3,z))/6*100;const zText=z===null?'—':(z>0?'+':'')+z.toFixed(1);return `<div class="z-row" aria-label="${label}: ${z===null?'Z-score unavailable':zText+' standard deviations; '+(z>0?'less favourable':z<0?'more favourable':'at baseline')}"><span class="z-label">${label}</span><div class="z-track" aria-hidden="true">${z!==null?`<span class="z-bar ${z>0?'more':''}" style="left:${Math.min(50,position)}%;width:${Math.abs(position-50)}%"></span><span class="z-dot ${z>0?'more':''}" style="left:${position}%"></span>`:''}</div><span class="z-value">${zText}</span></div>`}).join('')}</div><div class="z-axis" aria-hidden="true"><span>−3</span><span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span><span>+3</span></div></div><div class="snapshot-ratings"><div class="eyebrow">${hasLatest?'Latest ratings':'Ratings'}</div>${metricLabels.map((label,index)=>`<div class="rating-item"><span>${label}</span><strong>${hasLatest?state.wellness[index]:'—'}<small>${hasLatest?' /7':''}</small></strong></div>`).join('')}</div></div></section>`}
      function overview(){return `<div class="page-title"><h1 id="page-heading" tabindex="-1">Overview</h1><button class="btn primary" data-action="quick-log">＋ Quick log</button></div>
        <div class="priority"><section class="card"><div class="eyebrow">Next session</div><h2>Strength · Lower body</h2><p class="session-meta">Mon, 12 Oct · 08:00 · 60 min <span class="status">Confirmed</span></p><div class="actions"><a class="btn primary" href="#training" data-destination="training" data-date="${nextDate}">Review workout →</a><button class="btn" data-action="booking">View booking</button></div></section>
        <section class="card"><div class="review-head"><h2>What needs review</h2><span class="review-count">${(state.concernOpen?state.concernCount:0)+1+(!state.checkedIn?1:0)} items</span></div><div class="review-list" role="region" aria-label="Items needing review" tabindex="0">${reviewItems()}</div><div class="review-footer"><small>${state.concernOpen?state.concernCount+' open concern'+(state.concernCount===1?'':'s'):'No open concerns'}</small><a class="text-link" href="#concerns" data-destination="check-ins" data-view="concerns">All concerns →</a></div></section></div>
        <section class="card training"><div class="section-head"><h2>Today’s training</h2></div><div class="training-status">${workoutSummary()}</div>${week()}<div class="training-footer">${state.workout!=='unplanned'?`<details class="training-expand"><summary>Workout details</summary><div class="exercise"><span>Bench press</span><small>3 × 6</small></div><div class="exercise"><span>Seated cable row</span><small>3 × 10</small></div><div class="exercise"><span>Lat pulldown</span><small>3 × 10</small></div><div class="exercise"><span>Lateral raise</span><small>3 × 12</small></div><div class="exercise"><span>Triceps pressdown</span><small>2 × 12</small></div></details>`:''}</div></section>
        ${snapshot()}
        <div class="bottom"><details class="card concern-details" id="open-concerns"><summary><h2>${state.concernOpen?'Open concern':'Resolved concern'}</h2></summary><div class="concern-body"><span class="tag ${state.concernOpen?'high':''}">${state.concernOpen?'Open':'Resolved'}</span> <span class="tag">Training feedback</span><p>${state.concernOffset===0?'Shoulder discomfort reported during pressing.':esc(concernSamples[Math.min(state.concernOffset,concernSamples.length-1)])}</p><small>8 Oct 2026 · Client-reported</small><div class="actions">${state.concernOpen?'<button class="btn small primary" data-action="resolve-concern">Mark resolved</button>':''}<a class="btn small" href="#concerns" data-destination="check-ins" data-view="concerns">All concerns →</a></div></div></details>
        <section class="card"><h2>Recent activity</h2><div class="activity">${state.checkedIn?`<a href="#check-ins" data-destination="check-ins"><span class="activity-icon" aria-hidden="true">♡</span><span><strong>Wellness check-in</strong><small>Today · Manual entry</small></span></a>`:''}${state.workout==='completed'?`<a href="#training" data-destination="training" data-date="${today}"><span class="activity-icon" aria-hidden="true">✓</span><span><strong>Completed workout · Upper body</strong><small>Today · 48 min</small></span></a>`:''}<a href="#check-ins" data-destination="check-ins"><span class="activity-icon" aria-hidden="true">♡</span><span><strong>Wellness check-in</strong><small>8 Oct · Manual entry</small></span></a><a href="#training" data-destination="training" data-date="2026-10-07"><span class="activity-icon" aria-hidden="true">✓</span><span><strong>Completed workout · Lower body</strong><small>7 Oct · 52 min</small></span></a><a href="#assessments" data-destination="assessments"><span class="activity-icon" aria-hidden="true">◇</span><span><strong>Fitness reassessment</strong><small>6 Oct · Trainer-recorded</small></span></a></div></section></div>`}
      function heading(title){return `<div class="page-title"><h1 id="page-heading" tabindex="-1">${title}</h1>${link('Back to Overview','overview')}</div><p class="destination-note">Destination preview · existing ${title.toLowerCase()} flow</p>`}
      function training(){const completed=state.date==='2026-10-07'||state.date==='2026-10-05'||state.date===today&&state.workout==='completed';const unplanned=state.date!==nextDate&&state.date!==today&&!completed||state.date===today&&state.workout==='unplanned';return `${heading('Training')}<section class="card"><div class="eyebrow">Selected date · ${fmt(state.date)}</div><h2>${unplanned?'No workout planned':state.date===nextDate?'Lower body strength':completed?'Completed workout':'Upper body strength'}</h2><p class="session-meta">${unplanned?'Plan a workout for this date.':completed?'Completed workout log · recorded sets and reps':'Prescribed workout · editable in the existing builder'}</p>${unplanned?'<button class="btn primary" data-action="builder">＋ Plan workout</button>':`<table class="table"><thead><tr><th>Exercise</th><th>Sets × reps</th></tr></thead><tbody><tr><td>${state.date===nextDate?'Back squat':'Bench press'}</td><td>3 × 6</td></tr><tr><td>${state.date===nextDate?'Romanian deadlift':'Seated cable row'}</td><td>3 × 10</td></tr><tr><td>${state.date===nextDate?'Split squat':'Lat pulldown'}</td><td>3 × 10</td></tr></tbody></table><div class="actions" style="margin-top:16px"><button class="btn ${!completed&&state.date===today?'primary':''}" data-action="${!completed&&state.date===today?'runner':'builder'}">${completed?'Review recorded sets':state.date===today?'Start workout':'Open builder'}</button></div>`}<div class="route-card">The selected date travels with this action.<br><code>${esc(route('training'))}</code></div></section>`}
      function checkins(){return `${heading('Check-ins')}<div class="subtabs"><button data-checkview="wellness" class="${state.view==='wellness'?'active':''}">Wellness</button><button data-checkview="concerns" class="${state.view==='concerns'?'active':''}">Concerns</button><button data-checkview="wearables" class="${state.view==='wearables'?'active':''}">Wearables</button></div><section class="card">${state.view==='concerns'?`<div class="section-head"><h2>Client concerns</h2><button class="btn" data-action="flag-concern">＋ Flag concern</button></div>${state.concernOpen?concernSamples.slice(state.concernOffset,state.concernOffset+state.concernCount).map((name,index)=>`<div class="destination-row"><div><strong>${esc(name)}</strong><small>Client feedback · Open</small></div>${index===0?'<button class="btn small" data-action="resolve-concern">Mark resolved</button>':''}</div>`).join(''):'<p class="empty">No open concerns.</p>'}`:state.view==='wearables'?'<h2>Wearable observations</h2><p class="empty">No wearable data.</p><button class="btn" data-action="wearable-info">Device connection</button>':`<div class="section-head"><h2>Wellness check-ins</h2><button class="btn primary" data-action="record-checkin">＋ Record check-in</button></div><div class="destination-row"><div><strong>${state.checkedIn?'Today':'8 Oct 2026'}</strong><small>${['Sleep','Stress','Fatigue','Soreness'].map((label,index)=>label+' '+state.wellness[index]).join(' · ')}</small></div><span class="tag">Manual entry</span></div>`}</section>`}
      function assessments(){return `${heading('Assessments')}<section class="card"><h2>Baseline and reassessment</h2><div class="destination-row"><div><strong>Body composition</strong><small>Baseline missing</small></div><button class="btn" data-action="baseline">Add baseline</button></div><div class="destination-row"><div><strong>Movement screen</strong><small>Reassessment due</small></div><button class="btn" data-action="reassessment">Reassess</button></div><div class="destination-row"><div><strong>Fitness</strong><small>Last recorded 6 Oct 2026</small></div><button class="btn" data-action="assessment-history">View history</button></div></section>`}
      function progress(){return `${heading('Progress')}<div class="subtabs"><button class="active" data-progress="Strength">Strength</button><button data-progress="Training load">Training load</button><button data-progress="Outcomes">Outcomes</button><button data-progress="Completion">Completion</button></div><section class="card" id="progress-result"><h2>Strength</h2><p class="empty">Bench press · latest recorded load 45 kg · 7 Oct 2026</p></section>`}
      function profile(){return `${heading('Profile')}<section class="card"><div class="section-head"><h2>Goals</h2><button class="btn" data-action="goal">＋ Record goal update</button></div><p>Build consistent strength and conditioning</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="section-head"><h2>Preferences &amp; availability</h2><button class="btn" data-action="preferences">Edit preferences</button></div><p class="muted">Monday, Wednesday, Friday · Mornings</p></section>`}
      function schedule(){return `${heading('Schedule')}<section class="card"><div class="eyebrow">Selected booking · Feature Demo Client</div><h2>Monday, 12 October</h2><p class="session-meta">08:00 · Strength · Lower body · 60 min <span class="status">Confirmed</span></p><button class="btn primary" data-action="booking">View booking</button><div class="route-card">Uses the existing booking form for this appointment.<br><code>/schedule · selected booking: demo-next-session</code></div></section>`}
      function messages(){return `${heading('Messages')}<section class="card"><h2>Feature Demo Client</h2><div class="message-bubble">Ready for Monday’s session.</div>${state.messages.map(message=>`<div class="message-bubble mine">${esc(message)}</div>`).join('')}<form id="message-form"><label class="field" for="message-text">Message<textarea id="message-text" required placeholder="Write a message…"></textarea></label><button class="btn primary" type="submit">Send in preview</button></form></section>`}
      function report(){return `${heading('Report')}<section class="card"><div class="eyebrow">Feature Demo Client · Progress report</div><h2>Your work, recorded.</h2><p class="session-meta">12 completed workouts · 12 Sep–9 Oct 2026</p><div class="destination-grid"><div><h3>Strength</h3><p class="empty">Bench press · 45 kg</p></div><div><h3>Completed workouts</h3><p class="empty">12 in this period</p></div></div><button class="btn" data-action="report-options">Customize report</button></section>`}
      function clients(){return `${heading('Clients')}<section class="card"><div class="destination-row"><strong>Feature Demo Client</strong>${link('Open client','overview')}</div><div class="destination-row"><strong>Sharafath Client</strong><span class="tag">Other client · outside this preview</span></div></section>`}
      function render(){content.innerHTML=({overview,training,'check-ins':checkins,assessments,progress,profile,schedule,messages,report,clients}[state.page]||overview)();updateNavigation()}
      function recordCheckin(){openDialog('Record wellness check-in',`<form id="checkin-form"><p class="destination-note">${fmt(today)} · Rate how you feel today</p><div class="slider-grid">${['Sleep quality','Stress','Fatigue','Soreness'].map((label,index)=>{const value=state.baseline==='empty'&&!state.checkedIn?4:state.wellness[index];return `<div class="slider-field"><div class="slider-top"><label for="metric${index}">${label}</label><output for="metric${index}" id="metric${index}-value">${value}</output></div><input type="range" id="metric${index}" name="metric${index}" min="1" max="7" step="1" value="${value}" aria-describedby="metric${index}-ends" aria-valuetext="${value} of 7"><div class="scale-ticks" aria-hidden="true">${[1,2,3,4,5,6,7].map(n=>`<span>${n}</span>`).join('')}</div><div class="scale-ends" id="metric${index}-ends"><span>${index===0?'1 · Very poor':'1 · Very low'}</span><span>${index===0?'7 · Very good':'7 · Very high'}</span></div></div>`}).join('')}</div><div class="dialog-foot"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">Save in preview</button></div></form>`)}
      function booking(){locationLabel.textContent=route(state.page)+' · booking dialog: '+nextDate;openDialog('Session booking',`<p class="destination-note">Existing booking form · selected appointment</p><form id="booking-form"><label class="field">Client<input value="Feature Demo Client" readonly></label><div class="form-grid"><label class="field">Date<input type="date" value="${nextDate}"></label><label class="field">Time<input type="time" value="08:00"></label><label class="field">Duration<input type="number" value="60" min="1"></label><label class="field">Status<select><option>Confirmed</option><option>Pending</option><option>Completed</option><option>Cancelled</option></select></label></div><label class="field">Session type<input value="Strength · Lower body"></label><div class="dialog-foot"><button type="button" class="btn" data-action="close">Close</button><button type="button" class="btn" data-action="open-schedule">Open schedule</button><button type="submit" class="btn primary">Save in preview</button></div></form>`)}
      function builder(){openDialog('Workout builder',`<p class="destination-note">Feature Demo Client · ${fmt(state.date)} · existing builder</p><label class="field">Session name<input value="${state.date===nextDate?'Lower body strength':'Upper body strength'}"></label><div class="destination-row"><strong>Warm-up</strong><small>5 min mobility</small></div><div class="destination-row"><strong>Main block</strong><small>3 × 6 · 3 × 10 · 3 × 10</small></div><div class="destination-row"><strong>Cool-down</strong><small>5 min</small></div><div class="dialog-foot"><button class="btn" data-action="close">Close</button><button class="btn primary" data-action="save-plan">Save plan in preview</button></div>`)}
      function runner(){locationLabel.textContent=`/clients/${clientId}/training?date=${state.date}&run=1`;openDialog('Workout logging',`<p class="destination-note">Upper body strength · ${fmt(state.date)}</p><table class="table"><thead><tr><th>Exercise</th><th>Load</th><th>Reps</th><th>Done</th></tr></thead><tbody>${['Bench press','Cable row','Lat pulldown'].map((name,index)=>`<tr><td>${name}</td><td>${[45,35,40][index]} kg</td><td>${[6,10,10][index]}</td><td><input type="checkbox" aria-label="${name} set done"></td></tr>`).join('')}</tbody></table><div class="dialog-foot"><button class="btn" data-action="close">Save &amp; exit</button><button class="btn primary" data-action="complete-workout">Complete in preview</button></div>`)}
      const actions={
        'quick-log':()=>openDialog('Quick log',`<div class="quick-options">${[['Wellness','record-checkin'],['Session RPE','srpe'],['Resistance set','resistance'],['Conditioning','conditioning'],['Wearable reading','wearable-info'],['Body metric','baseline']].map(([label,action])=>`<button data-action="${action}">${label}</button>`).join('')}</div>`),
        'record-checkin':recordCheckin,booking,builder,runner,
        'review-concern':()=>{const details=document.getElementById('open-concerns');details.open=true;details.scrollIntoView({behavior:'smooth',block:'center'});details.querySelector('summary').focus();locationLabel.textContent=`/clients/${clientId}#open-concerns`},
        'resolve-concern':()=>openDialog('Resolve concern',`<label class="field">Resolution note<textarea id="resolution-note" placeholder="Optional note"></textarea></label><div class="dialog-foot"><button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="confirm-resolve">Resolve in preview</button></div>`),
        'confirm-resolve':()=>{state.concernOffset++;state.concernCount=Math.max(0,state.concernCount-1);state.concernOpen=state.concernCount>0;closeDialog();render();notify('One sample concern resolved. Production data is unchanged.')},
        'baseline-info':()=>openDialog('Personal baseline comparison',`<p>Each point compares the latest rating with earlier check-ins. Zero is your usual level; one Z-score unit is one standard deviation.</p><div class="baseline-stat"><code>Z = (latest rating − baseline mean) ÷ sample standard deviation</code><p style="margin-top:8px">Sleep is reversed so the right side always means less favourable: lower sleep, or higher stress, fatigue and soreness.</p></div><p class="destination-note" style="margin-top:14px">Preview rule: at least 7 earlier check-ins in the preceding 28 days. This is a proposed display rule. No point is drawn without enough history or with zero baseline variation. Points beyond ±3 stay at the edge; the numeric score stays exact.</p><table class="table"><thead><tr><th>Metric</th><th>Baseline mean</th><th>SD</th></tr></thead><tbody>${metricLabels.map((label,index)=>{const {n,mean,sd}=metricStats(index);return `<tr><td>${label}</td><td>${n?mean.toFixed(2):'—'}</td><td>${n>1?sd.toFixed(2):'—'}</td></tr>`}).join('')}</tbody></table><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>`),
        'open-schedule':()=>{closeDialog();go('schedule')},
        'save-plan':()=>{state.workout='planned';document.getElementById('sample-state').value='planned';closeDialog();render();notify('Sample plan saved in this preview.')},
        'complete-workout':()=>{state.workout='completed';document.getElementById('sample-state').value='completed';closeDialog();render();notify('Sample workout completed in this preview.')},
        close:()=>{closeDialog();updateNavigation()},
        'wearable-info':()=>openDialog('Device connection','<p>No wearable is connected in this sample.</p><p class="destination-note" style="margin-top:10px">The Wearables tab remains available. Overview only shows device data when a reading exists.</p><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        baseline:()=>openDialog('Add body composition baseline',`<form id="sample-entry"><div class="form-grid"><label class="field">Date<input type="date" value="${today}"></label><label class="field">Weight (kg)<input type="number" placeholder="Enter recorded value"></label></div><div class="dialog-foot"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary" type="submit">Save in preview</button></div></form>`),
        reassessment:()=>openDialog('Movement reassessment','<p>Existing movement assessment form opens here with this client selected.</p><label class="field" style="margin-top:14px">Recorded notes<textarea placeholder="Assessment notes"></textarea></label><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        'assessment-history':()=>openDialog('Fitness history','<div class="destination-row"><strong>6 Oct 2026</strong><small>Fitness reassessment</small></div><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        'flag-concern':()=>openDialog('Flag concern','<label class="field">Concern<textarea placeholder="Record the client’s concern"></textarea></label><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        goal:()=>openDialog('Record goal update','<label class="field">Goal<textarea>Build consistent strength and conditioning</textarea></label><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        preferences:()=>openDialog('Edit preferences','<label class="field">Availability<input value="Monday, Wednesday, Friday · Mornings"></label><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        'report-options':()=>openDialog('Customize report','<p>Existing report options open here with Feature Demo Client selected.</p><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'),
        srpe:()=>simpleLog('Record session RPE','RPE','1–10'),resistance:()=>simpleLog('Log resistance','Load (kg)','Recorded load'),conditioning:()=>simpleLog('Log conditioning','Duration (min)','Recorded duration')
      };
      function simpleLog(title,label,placeholder){openDialog(title,`<form id="sample-entry"><label class="field">Date<input type="date" value="${today}"></label><label class="field">${label}<input type="number" placeholder="${placeholder}" required></label><div class="dialog-foot"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Save in preview</button></div></form>`)}
      document.addEventListener('click',event=>{const destination=event.target.closest('[data-destination]');if(destination){event.preventDefault();go(destination.dataset.destination,{date:destination.dataset.date,view:destination.dataset.view});if(destination.dataset.run)runner();return}const action=event.target.closest('[data-action]');if(action){actions[action.dataset.action]?.();return}const day=event.target.closest('[data-day]');if(day){go('training',{date:day.dataset.day});return}const checkview=event.target.closest('[data-checkview]');if(checkview){state.view=checkview.dataset.checkview;render();return}const progressButton=event.target.closest('[data-progress]');if(progressButton){document.querySelectorAll('[data-progress]').forEach(b=>b.classList.toggle('active',b===progressButton));document.getElementById('progress-result').innerHTML=`<h2>${esc(progressButton.dataset.progress)}</h2><p class="empty">Existing ${esc(progressButton.dataset.progress.toLowerCase())} view for this client.</p>`;locationLabel.textContent=`/clients/${clientId}/progress#${{'Strength':'strength','Training load':'training-load','Outcomes':'outcomes','Completion':'attendance'}[progressButton.dataset.progress]}`;return}const globalButton=event.target.closest('[data-global]');if(globalButton){const target=globalButton.dataset.global;if(target==='Clients')go('clients');else if(target==='Schedule')go('schedule');else if(target==='Messages')go('messages');else if(target==='Concerns')go('check-ins',{view:'concerns'});else if(target==='Progress')go('progress');else openDialog(target,`<p>This opens the existing ${esc(target.toLowerCase())} page.</p><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>`);}});
      document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='checkin-form'){const values=new FormData(event.target);state.wellness=state.wellness.map((_,index)=>Number(values.get('metric'+index)));state.checkedIn=true;closeDialog();render();notify('Sample check-in recorded. Production data is unchanged.')}else if(event.target.id==='message-form'){const text=document.getElementById('message-text').value.trim();if(text){state.messages.push(text);render();notify('Message shown in preview only.')}}else{closeDialog();render();notify('Sample entry saved in this preview only.')}});
      document.getElementById('close-dialog').addEventListener('click',()=>{closeDialog();updateNavigation()});
      overlay.addEventListener('click',event=>{if(event.target===overlay){closeDialog();updateNavigation()}});
      document.addEventListener('keydown',event=>{if(overlay.hidden)return;if(event.key==='Escape'){closeDialog();updateNavigation()}if(event.key==='Tab'){const controls=[...overlay.querySelectorAll('button,a,input,select,textarea')].filter(el=>!el.disabled&&el.getClientRects().length);const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
      document.getElementById('sample-state').addEventListener('change',event=>{state.workout=event.target.value;go('overview')});
      document.getElementById('sample-concerns').addEventListener('change',event=>{state.concernCount=Number(event.target.value);state.concernOffset=0;state.concernOpen=true;go('overview')});
      document.getElementById('sample-baseline').addEventListener('change',event=>{state.baseline=event.target.value;state.checkedIn=false;go('overview')});
      document.addEventListener('input',event=>{if(event.target.matches('#checkin-form input[type=range]')){document.getElementById(event.target.id+'-value').textContent=event.target.value;event.target.setAttribute('aria-valuetext',event.target.value+' of 7')}});
      document.getElementById('show-changes').addEventListener('click',()=>openDialog('Proposed Overview changes',`<div class="change-row"><strong>1 · Actions retain the date</strong><p>Review workout opens Training with 12 Oct selected. View booking opens the existing booking form for that appointment.</p></div><div class="change-row"><strong>2 · Compact today’s training</strong><p>One status, one action for the current workout state, and the existing week strip. The repeated Training link is removed. Workout details expand on request; the full planner stays in Training.</p></div><div class="change-row"><strong>3 · Clear missing-plan wording</strong><p>An empty date says “No workout planned.” It is not automatically called a rest day.</p></div><div class="change-row"><strong>4 · Less spacing and repetition</strong><p>Priority cards have stable heights. Extra review items scroll inside the card; all concerns remain accessible. Recent activity uses the same bounded layout.</p></div><div class="change-row"><strong>5 · Relevant check-in and activity</strong><p>A Z-score chart compares the latest ratings with earlier check-ins; original 1–7 ratings remain visible. Record check-in uses four labelled sliders. Try the baseline and concern-count controls above to test the layout.</p></div><div class="dialog-foot"><button class="btn primary" data-action="close">Explore preview</button></div>`));
      document.getElementById('search-clients').addEventListener('click',()=>go('clients'));
      document.getElementById('notifications').addEventListener('click',()=>openDialog('Notifications','<p>No new notifications in this sample.</p><div class="dialog-foot"><button class="btn" data-action="close">Close</button></div>'));
      render();
    })();
  </script>
</body>
</html>
