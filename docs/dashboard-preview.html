<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), date='2026-10-12';
const paths={Dashboard:'/',Clients:'/clients',Workouts:'/workouts',Schedule:'/schedule',Progress:'/progress',Messages:'/messages',Concerns:'/concerns',Settings:'/settings'};
const icons={Dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',Clients:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.87 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',Workouts:'M6 6v12 M3 9v6 M6 12h12 M18 6v12 M21 9v6',Schedule:'M4 5h16v16H4z M4 10h16 M8 3v4 M16 3v4',Progress:'M4 3v18h17 M8 16v-4 M13 16V6 M18 16V9',Messages:'M3 3h18v14H7l-4 4z',Concerns:'M12 3 2 21h20z M12 9v5 M12 17v1',Settings:'M5 7h14 M5 17h14 M9 4v6 M15 14v6',search:'M15 15 21 21 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',arrow:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[k]||icons.arrow}"/></svg>`;
$('#nav').innerHTML=Object.entries(paths).map(([n,p])=>`<button ${n==='Dashboard'?'class="active" aria-current="page" data-action="home"':`data-route="${p}" data-title="${n}"`} aria-label="${n}">${icon(n)}<span>${n}</span></button>`).join('');$('#search-icon').innerHTML=icon('search');
const names=['Maya Patel','Omar Hassan','Leah Thomas','Noah Williams','Ava Martin','Liam Chen','Sofia James','Adam Cooper','Amelia Reed','Oliver Gray','Ella Evans','Ethan Brooks','Mia Scott','Lucas Bell','Isla King','Henry Cole','Emily Wood','Leo Green'];
let state,filter='review',coverageFilter='missing',chartMetric='sessions',period='28',toastTimer;
const initials=n=>n.split(' ').map(s=>s[0]).slice(0,2).join(''), clientPath=(id,suffix='')=>`/clients/${id}${suffix}`, getClient=id=>state.clients.find(c=>c.id===id);
const route=(title,path,label='Open →',cls='link')=>`<button class="${cls}" data-route="${esc(path)}" data-title="${esc(title)}">${esc(label)}</button>`;
const empty=(title,sub='',ic='Schedule')=>`<div class="empty"><span class="empty-icon">${icon(ic)}</span><strong>${title}</strong>${sub?`<span>${sub}</span>`:''}</div>`;
function init(mode='normal'){
 const count=mode==='new'?0:mode==='busy'?18:8;
 state={mode,clients:names.slice(0,count).map((name,i)=>({id:'demo-'+(i+1),name})),sessions:[],reviews:[],plans:[],checked:new Set(),noProgram:[]};filter='review';coverageFilter='missing';
 if(mode==='normal'||mode==='busy'){
 const n=mode==='busy'?12:4;
 state.sessions=Array.from({length:n},(_,i)=>({id:'booking-'+i,clientId:state.clients[i].id,time:i===0?'09:00':i===1?'10:30':`${String(12+i).padStart(2,'0')}:00`,status:i===0?'Completed':i===2?'Pending':'Confirmed',type:i===2?'Movement assessment':'Personal training',duration:'60'}));
 if(mode==='busy')state.sessions.forEach((s,i)=>s.time=`${String(7+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);
 state.checked=new Set(state.clients.slice(0,mode==='busy'?11:5).map(c=>c.id));
 state.reviews=[{clientId:'demo-2',reason:'High-severity concern',detail:'Open · reported yesterday',tone:'red',kind:'review',suffix:'/check-ins?view=concerns'}, {clientId:'demo-3',reason:'Screening awaiting clearance',detail:'Review the screening record',tone:'amber',kind:'review',suffix:'/assessments#health-screening'}, {clientId:'demo-4',reason:'Lower app readiness score',detail:'Today’s recorded inputs',tone:'amber',kind:'review',suffix:'/check-ins?view=wellness'}, {clientId:'demo-5',reason:'Fitness reassessment due',detail:'Review date · 10 Oct',tone:'neutral',kind:'followup',suffix:'/assessments/fitness'}, {clientId:'demo-6',reason:'No check-in for 9 days',detail:'Follow up with the client',tone:'neutral',kind:'followup',suffix:'/check-ins?view=wellness'}];
 if(mode==='busy')state.reviews.push(...state.clients.slice(7).map((c,i)=>({clientId:c.id,reason:i%2?'Movement reassessment due':'Open concern',detail:i%2?'Review date · 11 Oct':'Medium severity',tone:i%2?'neutral':'amber',kind:i%2?'followup':'review',suffix:i%2?'/assessments/movement':'/check-ins?view=concerns'})));
 state.plans=state.clients.slice(0,mode==='busy'?14:6).map((c,i)=>({clientId:c.id,name:['Upper body strength','Lower body strength','Full body A','Push','Pull','Conditioning'][i%6],done:i===0}));state.noProgram=state.clients.slice(-2);
 }
 render();
}
function scheduleRows(){const ordered=[...state.sessions].sort((a,b)=>a.time.localeCompare(b.time));const upcoming=ordered.find(s=>s.status!=='Completed'&&s.time>='09:30');return ordered.map(s=>{const c=getClient(s.clientId),next=s===upcoming;return `<div class="row ${next?'next':''}"><span class="time">${s.time}</span><span class="avatar">${initials(c.name)}</span><div class="info"><strong>${esc(c.name)}</strong><small>${s.type} · ${s.duration} min</small></div><div><div class="tag-line"><span class="badge ${next?'green':''}">${next?'Up next':s.status==='Pending'?'Scheduled':s.status}</span></div><button class="link row-action" data-action="session" data-id="${s.id}">Details →</button></div></div>`}).join('')}
function reviewRows(){return state.reviews.filter(r=>r.kind===filter).map(r=>{const c=getClient(r.clientId);return `<div class="row review-item ${r.tone}"><div class="info"><strong>${esc(c.name)}</strong><small>${r.reason}</small><div class="tag-line"><span class="badge ${r.tone}">${r.detail}</span></div></div>${route(r.reason,clientPath(c.id,r.suffix),'Review →','link row-action')}</div>`}).join('')||empty('No recorded items to review','Missing check-ins are listed below.','check')}
function coverageRows(){const rows=state.clients.filter(c=>coverageFilter==='missing'?!state.checked.has(c.id):state.checked.has(c.id));return rows.map(c=>`<div class="row"><span class="avatar">${initials(c.name)}</span><div class="info"><strong>${esc(c.name)}</strong></div>${route('Wellness check-ins',clientPath(c.id,'/check-ins?view=wellness'),coverageFilter==='missing'?'Open check-in →':'View check-in →','link row-action')}</div>`).join('')||empty(state.clients.length?(coverageFilter==='missing'?'Everyone has checked in':'No check-ins recorded'):'No clients yet','','check')}
function render(){const c=state.clients.length,n=state.sessions.length,checked=state.checked.size,reviewCount=state.reviews.filter(r=>r.kind==='review').length,followCount=state.reviews.length-reviewCount;
 $('#dashboard').innerHTML=`${state.mode==='new'?`<section class="card onboard"><h2>Start with your first client</h2><p>Add a client, record a baseline, then plan their training.</p><div class="onboard-steps"><button class="btn primary" data-action="add-client">＋ Add client</button><span>2. Record baseline</span><span>3. Plan training</span></div></section>`:''}
 <div class="stats"><button class="stat" data-action="search"><i class="stat-icon clients-icon">${icon('Clients')}</i><strong>${c}</strong><span>Active clients</span>${icon('arrow')}</button><button class="stat" data-action="jump" data-target="schedule"><i class="stat-icon schedule-icon">${icon('Schedule')}</i><strong>${n}</strong><span>Bookings today</span>${icon('arrow')}</button><button class="stat" data-action="jump" data-target="checkins"><i class="stat-icon checkin-icon">${icon('check')}</i><strong>${checked}<span> / ${c}</span></strong><span>Checked in today</span>${icon('arrow')}</button></div>
 <div class="grid"><section class="card work-card" id="schedule"><div class="head"><h2><span class="section-icon schedule-icon">${icon('Schedule')}</span>Today’s schedule</h2>${route('Schedule','/schedule','Full schedule →')}</div><div class="scroll" tabindex="0" aria-label="Today’s bookings">${n?scheduleRows():empty('No bookings today','Use Book session when you’re ready.')}</div><div class="card-footer"><span>${state.sessions.filter(s=>s.status==='Completed').length} completed · ${n} booked</span><span>Monday, 12 Oct</span></div></section>
 <section class="card work-card" id="review"><div class="head"><h2><span class="section-icon review-icon">${icon('Concerns')}</span>Needs review <span class="count">${state.reviews.length}</span></h2></div><div class="tabs" aria-label="Review category"><button data-action="review-filter" data-value="review" aria-pressed="${filter==='review'}">Review first · ${reviewCount}</button><button data-action="review-filter" data-value="followup" aria-pressed="${filter==='followup'}">Follow-up · ${followCount}</button></div><div class="scroll" tabindex="0" aria-label="Client review queue" id="review-rows">${reviewRows()}</div><div class="card-footer"><span>Concerns, screening &amp; dated follow-ups</span><span id="review-count">${filter==='review'?reviewCount:followCount} items</span></div></section></div>
 <div class="grid sub-grid"><section class="card checkin-card" id="checkins"><div class="head"><h2><span class="section-icon checkin-icon">${icon('check')}</span>Today’s check-ins</h2><button class="link" data-action="checkin" ${c?'':'disabled'}>Record check-ins →</button></div><div class="coverage"><div class="coverage-ring" style="--coverage:${c?checked/c*100:0}%" aria-hidden="true"><span>${c?Math.round(checked/c*100):0}<small>%</small></span></div><div><div class="big">${checked}<small> / ${c}</small></div><p>Active clients with a wellness check-in</p></div></div><div class="coverage-bar" role="progressbar" aria-label="Check-in coverage" aria-valuemin="0" aria-valuemax="${c||1}" aria-valuenow="${checked}"><span style="width:${c?checked/c*100:0}%"></span></div><div class="tabs" aria-label="Check-in filter"><button data-action="coverage-filter" data-value="missing" aria-pressed="${coverageFilter==='missing'}">Not recorded · ${c-checked}</button><button data-action="coverage-filter" data-value="recorded" aria-pressed="${coverageFilter==='recorded'}">Recorded · ${checked}</button></div><div class="scroll" tabindex="0" aria-label="Check-in clients" id="coverage-rows">${coverageRows()}</div></section>
 <section class="card plans-card"><div class="head"><h2><span class="section-icon clients-icon">${icon('Workouts')}</span>Planned workouts <span class="count">${state.plans.length}</span></h2><span class="date">Today</span></div><div class="scroll" tabindex="0" aria-label="Today’s prescribed workouts">${state.plans.map(p=>{const c=getClient(p.clientId);return `<div class="row"><span class="avatar">${initials(c.name)}</span><div class="info"><strong>${esc(c.name)}</strong><small>${p.name}${p.done?' · Completed':''}</small></div>${route('Client Training',clientPath(c.id,'/training?date='+date),'Training →','link row-action')}</div>`}).join('')||empty('No workouts planned today',c?'Open a client to plan their training.':'Add a client to begin.','Workouts')}</div>${state.noProgram.length?`<div class="notice"><span>${state.noProgram.length} clients without a current or upcoming program</span><button class="link" data-action="pick" data-purpose="program" data-unassigned="true">View →</button></div>`:state.mode==='quiet'?`<div class="card-footer"><span>Unplanned days are not assumed rest days.</span><button class="link" data-action="pick" data-purpose="training">Choose client →</button></div>`:''}</section></div>
 <details class="card fold" id="trends"><summary><strong>Roster trends &amp; recent records</strong><small>Activity, booked completion &amp; strength</small></summary><div class="trend-body"><div class="chart-controls"><div class="tabs" aria-label="Activity metric">${[['sessions','Bookings completed'],['checkins','Check-ins'],['load','Session load']].map(([v,n])=>`<button data-action="metric" data-value="${v}" aria-pressed="${chartMetric===v}">${n}</button>`).join('')}</div><label><span class="form-note">Period </span><select id="period" aria-label="Activity period"><option value="28" ${period==='28'?'selected':''}>28 days</option><option value="90" ${period==='90'?'selected':''}>90 days</option></select></label></div><div id="chart-area"></div><div class="trend-bottom"><div><h3>Booked session completion · 30 days</h3><strong class="metric">${['normal','busy'].includes(state.mode)?'22 / 26':'—'}</strong><p>${['normal','busy'].includes(state.mode)?'2 missed · 2 need a status update':'No past bookings recorded.'}</p><p>Past, non-cancelled bookings only.</p>${route('Schedule','/schedule','Review bookings →')}</div><div><h3>Latest strength estimate</h3>${['normal','busy'].includes(state.mode)?`<strong class="metric">65 kg <span class="form-note">estimated 1RM</span></strong><p>Maya Patel · Bench Press · 10 Oct</p>${route('Strength progress',clientPath('demo-1','/progress#strength'),'View strength →')}`:'<p>No strength estimates recorded.</p>'}</div></div></div></details>`;
 renderChart();
}
function renderChart(){const emptyData=!['normal','busy'].includes(state.mode),n=period==='28'?4:13,raw=chartMetric==='sessions'?[4,6,5,7,3,5,6,4,8,6,7,5,8]:chartMetric==='checkins'?[20,24,27,29,21,26,25,28,30,26,27,29,31]:[900,1200,1050,1450,1100,1300,1500,1200,1600,1400,1650,1500,1800],values=raw.slice(0,n),max=chartMetric==='sessions'?10:chartMetric==='checkins'?40:2000,width=820,height=210,left=43,bottom=173,top=12,w=width-left-10;
 const unit=chartMetric==='sessions'?'Completed bookings':chartMetric==='checkins'?'Recorded check-ins':'Recorded session load (sRPE · AU)',label=period==='28'?'14 Sep – 11 Oct 2026':'14 Jul – 11 Oct 2026';
 const bars=values.map((v,i)=>{const bw=w/n*.45,x=left+(i+.5)*w/n-bw/2,y=bottom-v/max*(bottom-top);return `<rect x="${x}" y="${y}" width="${bw}" height="${bottom-y}" rx="4" fill="#426e5d"><title>Period ${i+1}: ${v} ${unit}</title></rect>`}).join('');
 $('#chart-area').innerHTML=`<p class="chart-heading">${unit} · ${n===4?'weekly totals':'7-day totals; final period 6 days'} · ${label}</p><svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${emptyData?'Empty chart. No records in this period.':unit+' per period: '+values.join(', ')}">${[0,1,2,3,4].map(i=>{const y=bottom-i*(bottom-top)/4;return `<line x1="${left}" x2="810" y1="${y}" y2="${y}" stroke="#e6e8e3"/><text x="34" y="${y+4}" text-anchor="end">${max*i/4}</text>`}).join('')}${emptyData?`<text x="426" y="92" text-anchor="middle">No records in this period</text>`:bars}<text x="43" y="200">${period==='28'?'14 Sep':'14 Jul'}</text><text x="425" y="200" text-anchor="middle">${period==='28'?'28 Sep':'28 Aug'}</text><text x="810" y="200" text-anchor="end">11 Oct</text></svg>${chartMetric==='load'?'<p class="form-note">Recorded load only; missing logs do not establish rest days.</p><button class="link" data-action="pick" data-purpose="load">View a client’s load records →</button>':''}`;
}
function modal(title,body){$('#modal-content').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close" data-action="close" aria-label="Close dialog">×</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal()}
function notify(s){clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function destination(title,path){modal(title,`<p class="modal-copy">This action opens <strong>${esc(title)}</strong>${path.includes('/clients/')?' for the selected client':''}.</p><code class="route">${esc(path)}</code><p class="form-note">Destination preview only. These sample clients are not app records.</p><div class="modal-foot"><button class="btn primary" data-action="close">Back to Dashboard</button></div>`)}
function picker(purpose='overview',unassigned=false){const list=unassigned?state.noProgram:state.clients;modal(purpose==='program'?'Assign a program':purpose==='assessment'?'Record an assessment':purpose==='training'?'Choose a client':purpose==='load'?'Review training load':'Find a client',`<input class="search-input" id="client-search" aria-label="Find client by name" placeholder="Search by name…"><div class="picker" id="picker" data-purpose="${purpose}">${list.map(c=>`<button data-action="client-choice" data-id="${c.id}" data-purpose="${purpose}"><span>${esc(c.name)}</span><span>→</span></button>`).join('')||'<p class="modal-copy">Add a client first.</p>'}</div><p id="no-matches" class="form-note" hidden>No matching clients.</p>`)}
function book(session){if(!state.clients.length){modal('Add a client first','<p class="modal-copy">A booking needs a client.</p><div class="modal-foot"><button class="btn primary" data-action="add-client">Add client</button></div>');return}modal(session?'Booking details':'Book a session',`<form class="form" id="booking" data-id="${session?.id||''}"><label>Client<select name="client">${state.clients.map(c=>`<option value="${c.id}" ${session?.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div class="pair"><label>Date<input type="date" name="date" value="${date}" required></label><label>Time<input type="time" name="time" value="${session?.time||'11:30'}" required></label></div><label>Session type<select name="type"><option ${session?.type==='Personal training'?'selected':''}>Personal training</option><option ${session?.type==='Movement assessment'?'selected':''}>Movement assessment</option></select></label><label>Status<select name="status">${['Pending','Confirmed','Completed','Cancelled'].map(s=>`<option ${s===(session?.status||'Confirmed')?'selected':''}>${s}</option>`).join('')}</select></label><p class="form-note">Preview of the existing booking form. Saves affect this demo only.</p><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">${session?'Save preview changes':'Add preview booking'}</button></div></form>`)}
function checkin(){const missing=state.clients.filter(c=>!state.checked.has(c.id));modal('Record check-ins',`<p class="modal-copy">The Dashboard opens the existing bulk check-in form. Choose a sample client to try a 1–7 entry.</p>${missing.length?`<form class="form" id="checkin-form" style="margin-top:16px"><label>Client<select name="client">${missing.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>${['Sleep quality','Stress','Fatigue','Soreness'].map((n,i)=>`<label>${n}<select name="score${i}" required><option value="">Choose rating</option>${Array.from({length:7},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select></label>`).join('')}<p class="form-note">Sleep: 7 = best. Stress, fatigue and soreness: 1 = best. No score is calculated in this preview.</p><div class="modal-foot"><button class="btn primary">Save preview check-in</button></div></form>`:'<p class="modal-copy" style="margin-top:15px">All active clients have a sample check-in today.</p>'}`)}
function decisions(){modal('A clearer daily starting point',`<ol class="decision-list"><li><strong>Today comes first.</strong> Schedule and review queue replace the large shortcut strip at the top.</li><li><strong>One place per action.</strong> Book session in the header, Record check-ins in its card, occasional actions under More actions.</li><li><strong>One review queue.</strong> Concerns and screening first; dated follow-ups in a separate filter. Each item opens its client’s relevant tab.</li><li><strong>Stable cards.</strong> Long lists scroll inside fixed-height cards; nothing stretches the neighbouring card.</li><li><strong>Missing data stays neutral.</strong> A missing check-in is not a risk label. An unplanned day is not assumed rest.</li><li><strong>Keep the useful detail.</strong> Activity, past booking completion and strength estimates move into a lower disclosure.</li><li><strong>Use the existing workflows.</strong> Reuse booking, bulk check-in, client Training, Assessments and Programs.</li></ol><p class="form-note">Implementation notes: use the coach timezone for “up next”; show prescription names instead of notes; exclude future/cancelled bookings from completion; don’t label every e1RM record a personal best. This HTML changes no application code.</p>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-route]');if(!b)return;if(b.dataset.route){destination(b.dataset.title,b.dataset.route);return}const a=b.dataset.action;if(a!=='home')document.querySelectorAll('.menu[open]').forEach(m=>m.removeAttribute('open'));
 if(a==='navigation')modal('Navigation',`<div class="picker">${Object.entries(paths).map(([n,p])=>`<button data-route="${p}" data-title="${n}">${n}<span>→</span></button>`).join('')}</div>`);else if(a==='close')$('#modal').close();else if(a==='decisions')decisions();else if(a==='home'){window.scrollTo({top:0,behavior:'smooth'})}else if(a==='jump')$('#'+b.dataset.target).scrollIntoView({behavior:'smooth',block:'start'});else if(a==='search')picker();else if(a==='pick')picker(b.dataset.purpose,b.dataset.unassigned==='true');else if(a==='book')book();else if(a==='session')book(state.sessions.find(s=>s.id===b.dataset.id));else if(a==='checkin')checkin();else if(a==='add-client')modal('Add client',`<form class="form" id="add-client"><label>Client name<input name="name" required maxlength="80" placeholder="Full name"></label><p class="form-note">Creates a fictional client in this preview only.</p><div class="modal-foot"><button class="btn primary">Add preview client</button></div></form>`);else if(a==='client-choice'){const id=b.dataset.id,p=b.dataset.purpose;destination(p==='program'?'Programs library':p==='assessment'?'Client Assessments':p==='training'?'Client Training':p==='load'?'Training load':'Client Overview',p==='program'?'/workouts?clientId='+id:clientPath(id,p==='assessment'?'/assessments':p==='training'?'/training?date='+date:p==='load'?'/progress#training-load':''))}else if(a==='review-filter'){filter=b.dataset.value;$('#review-rows').innerHTML=reviewRows();document.querySelectorAll('[data-action="review-filter"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#review-count').textContent=state.reviews.filter(r=>r.kind===filter).length+' items'}else if(a==='coverage-filter'){coverageFilter=b.dataset.value;$('#coverage-rows').innerHTML=coverageRows();document.querySelectorAll('[data-action="coverage-filter"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}else if(a==='metric'){chartMetric=b.dataset.value;document.querySelectorAll('[data-action="metric"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderChart()}});
document.addEventListener('change',e=>{if(e.target.id==='scenario')init(e.target.value);else if(e.target.id==='period'){period=e.target.value;renderChart()}});
document.addEventListener('input',e=>{if(e.target.id==='client-search'){const q=e.target.value.toLowerCase();$('#picker').querySelectorAll('button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));$('#no-matches').hidden=!!$('#picker').querySelector('button:not([hidden])')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=new FormData(f);if(f.id==='add-client'){const name=v.get('name').trim();if(!name){f.elements.name.setCustomValidity('Enter a name.');f.elements.name.reportValidity();f.elements.name.setCustomValidity('');return}state.clients.push({id:'preview-'+Date.now(),name});if(state.mode==='new')state.mode='quiet';$('#modal').close();render();notify('Client added to this preview only.')}else if(f.id==='booking'){const existing=state.sessions.find(s=>s.id===f.dataset.id);state.sessions=state.sessions.filter(s=>s.id!==f.dataset.id);if(v.get('date')===date&&v.get('status')!=='Cancelled')state.sessions.push({id:existing?.id||'preview-'+Date.now(),clientId:v.get('client'),time:v.get('time'),type:v.get('type'),status:v.get('status'),duration:'60'});$('#modal').close();render();notify(v.get('date')!==date?'Sample booking saved for '+v.get('date')+'. It is outside today’s list.':'Sample booking updated. No app records changed.')}else if(f.id==='checkin-form'){state.checked.add(v.get('client'));state.reviews=state.reviews.filter(r=>!(r.clientId===v.get('client')&&r.reason.startsWith('No check-in')));$('#modal').close();render();notify('Sample check-in recorded. Coverage updated.')}});
init();
})();
</script></body></html>
