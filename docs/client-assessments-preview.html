<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={fitness:'Fitness',movement:'Movement screen',body_comp:'Body composition',pain:'Pain'};
const today='2026-10-10', base='/clients/feature-demo';
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const addDays=(d,n)=>{const date=new Date(d+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+n);return date.toISOString().slice(0,10)};
const icons={fitness:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',movement:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',body_comp:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7 10a5 5 0 0 1 10 0M12 10l2-3"/>'};
let state, returnFocus, toastTimer;
const sample=(type,date,phase,value,detail)=>({id:Math.random().toString(36).slice(2),type,date,phase,value,detail,source:'Coach assessment'});
function loadScenario(){const mode=$('#scenario').value;state={mode,screen:mode==='empty'?'none':mode==='draft'?'draft':mode==='review'?'review':mode==='expired'?'expired':'complete',clearance:'requested',records:[]};
if(!['empty','draft'].includes(mode))state.records=[sample('fitness','2026-07-01','baseline','3-min step test','Recovery HR · 112 bpm'),sample('fitness','2026-09-26','reassessment','3-min step test','Recovery HR · 102 bpm'),sample('body_comp','2026-07-01','baseline','78.5 kg','Body fat · 24% · BIA'),sample('body_comp','2026-09-26','reassessment','76.2 kg','Body fat · 22.1% · BIA')];
if(!['empty','partial','draft'].includes(mode))state.records.push(sample('movement','2026-07-01','baseline','4 findings','NASM screen · 1 asymmetric'),sample('movement',mode==='review'?'2026-07-01':'2026-09-26','reassessment','2 findings','NASM screen · 1 asymmetric'));
if(mode==='review')state.records.push(sample('pain','2026-10-08','baseline','Left knee · 3/10','Aggravated by deep squat · Coach assessment'));
render();syncJump();}
function list(type){return state.records.filter(r=>!type||r.type===type).sort((a,b)=>b.date.localeCompare(a.date)||state.records.indexOf(b)-state.records.indexOf(a));}
function badge(text,tone=''){return `<span class="badge ${tone}">${text}</span>`}
function assessmentCard(type){const rows=list(type),r=rows[0],baseline=rows.some(x=>x.phase==='baseline'),due=r?addDays(r.date,84):null,overdue=due&&due<today;return `<article class="card assessment-card"><div class="card-top"><span class="type-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${icons[type]}</svg></span><h3>${names[type]}</h3>${badge(!baseline?'Baseline needed':overdue?'Review due':'Recorded',overdue?'amber':'')}</div><div class="card-body">${r?`<div class="metric">${esc(r.value)}</div><p class="summary-line">${esc(r.detail)}</p><p class="review-date ${overdue?'overdue':''}">Latest ${fmt(r.date)}<br>${overdue?'Review due':'Review'} ${fmt(due)}</p>`:'<p class="empty-copy">No assessment recorded.</p>'}</div><div class="card-actions"><button class="btn" data-add="${type}">${baseline?'Record reassessment':'Add baseline'}</button>${r?`<button class="text-link" data-history="${type}">History · ${rows.length} →</button>`:'<span class="empty-history-space" aria-hidden="true"></span>'}</div></article>`;}
function render(){const screen=state.screen,hasScreen=!['none','draft'].includes(screen),gated=screen==='review'&&state.clearance!=='received',expired=screen==='expired',done=['fitness','movement','body_comp'].filter(t=>list(t).some(r=>r.phase==='baseline')).length,pain=list('pain');
$('#content').innerHTML=`<div class="page-title"><h1>Assessments</h1><button class="btn primary" data-action="new">＋ New assessment</button></div><nav class="jump" aria-label="Assessment groups"><a href="#health-screening">Health screening</a><a href="#formal-assessments">Baseline & reassessment</a></nav>
<section class="card" id="health-screening" aria-labelledby="screen-title"><div class="screen-head"><div><div class="eyebrow">Trainer-only</div><h2 id="screen-title">Health screening</h2></div><button class="btn ${hasScreen?'':'primary'}" data-action="screen">${screen==='none'?'Record screening':screen==='draft'?'Continue screening':'Re-screen'}</button></div>
<div class="screen-status">${hasScreen?badge(gated?'Review required':expired?'Screening expired':'Program ready',gated?'red':expired?'amber':'green'):badge(screen==='draft'?'Draft saved':'No screening on file')}${hasScreen?badge(screen==='review'?'PAR-Q+ C · Review required':'PAR-Q+ A · Cleared'):''}</div>
${hasScreen?`<p class="screen-date">Completed ${expired?'26 Sep 2025':'26 Sep 2026'} · ${expired?'Expired 26 Sep 2026':'Valid until 26 Sep 2027'}</p>`:''}
${gated?`<div class="review-strip"><span>Clearance ${state.clearance==='requested'?'requested':'not started'} · Program gated</span><button class="text-link" data-action="clearance">Review clearance →</button></div>`:expired?'<div class="review-strip">Re-screen before relying on this record.</div>':''}
${hasScreen?'<div class="screen-foot"><button class="text-link" data-action="screen-details">View screening record →</button><button class="text-link" data-action="screen-history">Previous screenings · 1</button><button class="text-link" data-destination="concerns">New concern →</button></div>':''}</section>
<section class="section" id="formal-assessments" aria-labelledby="formal-title"><div class="section-head"><div class="title-group"><h2 id="formal-title">Baseline & reassessment</h2><button class="info" aria-label="About review dates" data-action="review-info">i</button></div><div class="baseline-summary"><span>${done}/3 baselines</span><span class="mini-track" aria-hidden="true"><span style="width:${done/3*100}%"></span></span></div></div><div class="assessment-grid">${['fitness','movement','body_comp'].map(assessmentCard).join('')}</div>
<article class="card pain-card"><div><h3>Pain assessment</h3><p>${pain.length?`${esc(pain[0].value)} · ${fmt(pain[0].date)}`:'No pain assessment recorded.'}</p></div><div class="pain-actions">${pain.length?`<button class="text-link" data-history="pain">History · ${pain.length} →</button>`:''}<button class="btn" data-add="pain">Record pain</button></div></article></section>
${state.records.length?`<details class="card fold" id="all-history"><summary>Assessment history <span class="badge">${state.records.length} records</span></summary><div class="history-body"><div class="history-controls"><label class="sr-only" for="history-filter">Filter assessment history</label><select id="history-filter"><option value="">All types</option>${Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="history-scroll" id="history-rows" tabindex="0" aria-label="Assessment history records">${historyRows('')}</div></div></details>`:''}
<div class="bottom-links"><button class="text-link" data-destination="progress">Compare outcomes in Progress →</button><button class="text-link" data-destination="profile">Goals & lifestyle in Profile →</button></div>`;
}
function historyRows(type){const records=list(type);return records.length?records.map(r=>`<div class="history-row"><div><strong>${names[r.type]} · ${fmt(r.date)}</strong><small>${r.phase==='baseline'?'Baseline':'Reassessment'} · ${esc(r.value)}</small></div><button class="text-link" data-record="${r.id}" aria-label="View ${names[r.type]} ${fmt(r.date)} ${r.phase}">View →</button></div>`).join(''):'<p class="empty-copy">No records for this type.</p>';}
function modal(title,body){returnFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;if(!$('#modal').open)$('#modal').showModal();$('#close').focus();}
function close(){ $('#modal').close();if(returnFocus?.isConnected)returnFocus.focus(); }
function notify(text){$('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4000);}
function destination(key){const map={overview:['Overview',base],training:['Training',base+'/training'],progress:['Progress · Outcomes',base+'/progress#outcomes'],'check-ins':['Check-ins',base+'/check-ins'],concerns:['Check-ins · Concerns',base+'/check-ins?view=concerns'],profile:['Profile · Goals & lifestyle',base+'/profile'],messages:['Messages','/messages?clientId=feature-demo'],report:['Client report','/report/feature-demo'],clients:['Clients','/clients']};const [label,path]=map[key]||[key,'/'+key.toLowerCase()];modal(label,`<p class="modal-copy">This action opens ${esc(label)} in the app.</p><code class="route">${esc(path)}</code><div class="modal-foot"><button class="btn" data-action="close">Back to preview</button></div>`);}
function history(type){modal(names[type]+' history',`<p class="modal-copy">Existing assessment detail page · newest first</p><code class="route">${base}/assessments/${type}</code><div class="history-scroll">${historyRows(type)}</div><div class="modal-foot"><button class="btn" data-add="${type}">Record ${type==='pain'?'pain':'reassessment'}</button></div>`);}
function record(id){const r=state.records.find(x=>x.id===id);modal(names[r.type]+' record',`<div class="kv"><span>Assessed</span><strong>${fmt(r.date)}</strong></div><div class="kv"><span>Phase</span><span>${r.phase==='baseline'?'Baseline':'Reassessment'}</span></div><div class="kv"><span>Result</span><span>${esc(r.value)}</span></div><div class="kv"><span>Details</span><span>${esc(r.detail)}</span></div><div class="kv"><span>Source</span><span>${esc(r.source)}</span></div><p class="detail-note">Edit and delete remain in the existing record actions menu.</p><div class="modal-foot"><button class="btn" data-history="${r.type}">Back to history</button></div>`);}
function add(type){const baseline=list(type).some(r=>r.phase==='baseline');modal(names[type]+' · '+(baseline?'Reassessment':'Baseline'),`<p class="modal-copy">Preview of the entry point. The app’s full ${names[type].toLowerCase()} form will stay available.</p><form id="sample-form" data-type="${type}"><div class="form-grid"><label class="field">Date<input name="date" type="date" value="${today}" max="${today}" required></label><label class="field">Phase<select name="phase"><option value="baseline" ${!baseline?'selected':''}>Baseline</option><option value="reassessment" ${baseline?'selected':''}>Reassessment</option></select></label></div><label class="field">Sample result<input name="result" value="${type==='fitness'?'3-min step test':type==='movement'?'2 findings':type==='body_comp'?'76.2 kg':'Left knee · 3/10'}" maxlength="80" required></label><label class="field" style="margin-top:14px">Notes<textarea name="notes" maxlength="160" placeholder="Optional"></textarea></label><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">Save in preview</button></div></form>`);}
function screenDetails(historical=false){modal(historical?'Previous screening':'Screening record',`<div class="kv"><span>Completed</span><span>${historical?(state.screen==='expired'?'26 Sep 2024':'26 Sep 2025'):(state.screen==='expired'?'26 Sep 2025':'26 Sep 2026')}</span></div><div class="kv"><span>PAR-Q+ outcome</span><span>${state.screen==='review'&&!historical?'C · Review required':'A · Cleared'}</span></div><div class="kv"><span>Clearance</span><span>${state.screen==='review'&&!historical?esc(state.clearance):'No action recorded'}</span></div>${state.screen==='review'&&!historical?'<div class="detail-note">Sample trigger: a follow-up answer requires review. Program start remains gated until clearance is received.</div>':''}<details class="screen-answers"><summary>Recorded intake answers</summary><p class="modal-copy">The existing intake view contains PAR-Q+ answers, health history, declaration and source details.</p><p class="detail-note">Fictional preview: questionnaire and signed records are not recreated here.</p></details><details class="screen-answers"><summary>Coach recommendation</summary><p class="modal-copy">The existing recorded recommendation and any review flags remain available here.</p></details><div class="modal-foot">${state.screen==='review'&&!historical?'<button class="btn" data-action="clearance">Review clearance</button>':''}<button class="btn" data-action="close">Close</button></div>`);}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;
if(el.dataset.destination){e.preventDefault();if(el.dataset.destination==='assessments'){document.querySelector('#content').scrollIntoView({block:'start'});return;}destination(el.dataset.destination);return;}if(el.dataset.global){destination(el.dataset.global);return;}
if(el.dataset.add){add(el.dataset.add);return;}if(el.dataset.history){history(el.dataset.history);return;}if(el.dataset.record){record(el.dataset.record);return;}
switch(el.dataset.action){case'close':close();break;case'new':modal('New assessment',`<div class="options">${Object.entries(names).map(([k,v])=>`<button class="btn" data-add="${k}"><span>${v}<small>${k==='pain'?'Dated pain assessment':list(k).some(r=>r.phase==='baseline')?'Record reassessment':'Add baseline'}</small></span><span>→</span></button>`).join('')}</div>`);break;
case'review-info':modal('Review dates','<p class="modal-copy">Review reminders follow the current 84-day setting. They are scheduling prompts, not clinical thresholds. Pain assessments are outside the three onboarding baselines.</p><div class="modal-foot"><button class="btn" data-destination="Settings">Open Settings →</button></div>');break;
case'screen':modal(state.screen==='draft'?'Continue screening with client':'Screening with client',`<p class="modal-copy">Opens the existing guided screening: consent, PAR-Q+, health history, goals and declaration.</p><p class="detail-note">The questionnaire and clearance rules stay unchanged. Use the scenario selector to preview completed, draft and review states.</p><div class="modal-foot"><button class="btn" data-action="close">Back to preview</button></div>`);break;
case'screen-details':screenDetails();break;case'screen-history':screenDetails(true);break;
case'clearance':modal('Review clearance',`<p class="modal-copy">Fictional example · existing clearance workflow</p><form id="clearance-form"><div class="form-grid"><label class="field">Action<select><option>Physician clearance letter</option><option>ePARmed-X+ / physician clearance</option><option>No action needed</option></select></label><label class="field">Status<select name="status"><option value="not_started">Not started</option><option value="requested" ${state.clearance==='requested'?'selected':''}>Requested</option><option value="received" ${state.clearance==='received'?'selected':''}>Received</option></select></label><label class="field">Date cleared<input type="date" name="cleared"></label><label class="field">Clearance letter URL<input type="url" placeholder="https://"></label></div><label class="field">Notes<textarea name="notes"></textarea></label><p class="detail-note">Program start stays gated until clearance is marked Received.</p><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary">Apply in preview</button></div></form>`);break;
}});
document.addEventListener('submit',e=>{if(e.target.id==='sample-form'){e.preventDefault();const f=new FormData(e.target),type=e.target.dataset.type;state.records.push(sample(type,f.get('date'),f.get('phase'),f.get('result').trim(),f.get('notes').trim()||'Coach assessment'));close();render();notify('Sample assessment saved in this preview.');}else if(e.target.id==='clearance-form'){e.preventDefault();state.clearance=new FormData(e.target).get('status');close();render();notify('Preview clearance updated.');}});
document.addEventListener('change',e=>{if(e.target.id==='history-filter')$('#history-rows').innerHTML=historyRows(e.target.value);});
$('#scenario').addEventListener('change',loadScenario);$('#reset').addEventListener('click',()=>{loadScenario();notify('Sample reset.');});$('#close').addEventListener('click',close);
$('#changes').addEventListener('click',()=>modal('What changes?',`<ul class="change-list"><li>One screening card with status, dates and the next action.</li><li>One compact baseline count; each category has its own single recording action.</li><li>Consistent card sizes, with latest results and review dates.</li><li>No empty history buttons. Long histories scroll inside an expandable panel.</li><li>Pain stays separate from the three onboarding baselines.</li><li>Existing assessment forms, screening, clearance and record actions remain available.</li></ul><p class="detail-note">Preview only. No app data is read or saved. Buttons demonstrate the intended action or destination.</p>`));
$('#search-clients').addEventListener('click',()=>destination('clients'));$('#notifications').addEventListener('click',()=>modal('Notifications','<p class="modal-copy">The existing notifications panel opens here.</p>'));function syncJump(){document.querySelectorAll('.jump a').forEach(a=>{if(a.hash===(location.hash||'#health-screening'))a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}window.addEventListener('hashchange',syncJump);loadScenario();syncJump();
</script></body></html>
