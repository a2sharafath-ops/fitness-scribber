 clients=mode==='new'?[]:structuredClone(sample).map(c=>({...c,status:c.status||'Active'}));
 if(mode==='busy')for(let i=1;i<=24;i++){const names=['Amelia Reed','Oliver Gray','Ella Evans','Ethan Brooks','Mia Scott','Lucas Bell','Isla King','Henry Cole'];const base=sample[i%6];clients.push({...structuredClone(base),id:'larger-'+i,name:names[(i-1)%8]+(i>8?' '+Math.ceil(i/8):''),email:'coach-test-'+i+'@example.test',status:i%9===0?'Inactive':'Active',assignment:base.program?'larger-assignment-'+i:null})}
 filter='active';query='';sort='name';unassigned=false;page=1;$('#search').value='';$('#sort').value='name';$('#unassigned').checked=false;render();
}
const reviewRank=c=>c.status!=='Active'?3:c.review?(c.review.kind==='urgent'?0:1):2;
function rows(){const q=query.trim().toLowerCase();let list=clients.filter(c=>(filter==='all'||filter==='active'&&c.status==='Active'||filter==='inactive'&&c.status==='Inactive'||filter==='review'&&c.status==='Active'&&c.review)&&(!unassigned||!c.program)&&(!q||[c.name,c.email,c.goal,c.program].some(v=>String(v||'').toLowerCase().includes(q))));
 list.sort((a,b)=>sort==='recent'?(b.activity||'').localeCompare(a.activity||'')||a.name.localeCompare(b.name):sort==='review'?reviewRank(a)-reviewRank(b)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));return list;
}
function row(c,index){const suffix=c.source==='Workout log'?'/training?date='+c.activity:c.source==='Assessment'?'/assessments':'/check-ins?view=wellness';const inactive=c.status==='Inactive';
 return `<tr><td class="client-cell"><div class="identity"><span class="avatar ${inactive?'inactive':['','rose','lilac','sand'][index%4]}">${esc(initials(c.name))}</span><div class="identity-text">${route('Client Overview',path(c.id),esc(c.name)+'<span class="arrow" aria-hidden="true">→</span>','client-link')}<span class="email">${esc(c.email||'No email recorded')}</span>${inactive?'<span class="mini-badge inactive">Inactive</span>':c.isNew?'<span class="mini-badge">New client</span>':''}</div></div></td>
 <td class="program-cell"><span class="mobile-label">Program</span>${c.program?route('Client’s program copy','/workouts?assignment='+encodeURIComponent(c.assignment)+'&clientId='+encodeURIComponent(c.id),esc(c.program),'program-name'):`${inactive?'<span class="muted">No current program</span>':route('Assign a program','/workouts?clientId='+encodeURIComponent(c.id),'＋ Assign program','assign')}`}<span class="cell-note ${c.upcoming?'upcoming':''}">${c.program?esc(c.week):inactive?'': 'No current or upcoming program'}</span></td>
 <td class="booked-cell"><span class="mobile-label">Booked sessions · 30 days</span>${c.booked?route('Booked session completion',path(c.id,'/progress#attendance'),`${c.completed} <span>/ ${c.booked}</span>`,'completion'):'<span class="muted">No past bookings</span>'}${c.booked?`<div class="bar" aria-hidden="true"><i style="width:${c.completed/c.booked*100}%"></i></div><span class="cell-note">completed</span>`:''}</td>
 <td class="activity-cell"><span class="mobile-label">Latest record</span>${c.activity?route(c.source,path(c.id,suffix),esc(dateLabel(c.activity)),'latest'):'<span class="muted">Not recorded</span>'}${c.source?`<span class="cell-note">${esc(c.source)}</span>`:''}</td>
 <td class="review-cell"><span class="mobile-label">Review</span>${!inactive&&c.review?route(c.review.label,path(c.id,c.review.to),`<span>${esc(c.review.label)}</span><b aria-hidden="true">→</b>`,'review '+c.review.kind)+`<div class="review-footnote">${esc(c.review.detail)}</div>`:'<span class="muted">'+(inactive?'Inactive client':'No flagged items')+'</span>'}</td></tr>`;
}
function render(){const active=clients.filter(c=>c.status==='Active').length,review=clients.filter(c=>c.status==='Active'&&c.review).length,counts={active,all:clients.length,review,inactive:clients.length-active};$('#roster-total').textContent=`${clients.length} total · ${active} active`;
 $('#filters').innerHTML=[['active','Active'],['all','All clients'],['review','Needs review'],['inactive','Inactive']].map(([key,label])=>`<button data-action="filter" data-value="${key}" aria-pressed="${filter===key}">${label}<span class="count">${counts[key]}</span></button>`).join('');
 $('.clear').hidden=!query;$('#active-query').hidden=!(query||unassigned);$('#filter-description').textContent=[query.trim()?`Search: “${query.trim()}”`:'',unassigned?'Without a program':''].filter(Boolean).join(' · ');
 const list=rows(),pages=Math.max(1,Math.ceil(list.length/perPage));page=Math.min(page,pages);const start=(page-1)*perPage,visible=list.slice(start,start+perPage);
 $('#list').innerHTML=visible.length?`<table aria-label="Client roster results"><colgroup><col style="width:27%"><col style="width:23%"><col style="width:14%"><col style="width:16%"><col style="width:20%"></colgroup><thead><tr><th scope="col">Client</th><th scope="col">Program</th><th scope="col">Booked sessions<small>Past 30 days</small></th><th scope="col">Latest record</th><th scope="col">Review</th></tr></thead><tbody>${visible.map(row).join('')}</tbody></table>`:`<div class="empty"><span class="empty-icon">${icon(clients.length?'search':'Clients')}</span><h3>${clients.length?'No clients match':'Meet your first client'}</h3><p>${clients.length?'Try another name or reset the filters.':'Add a client to start planning and tracking their training.'}</p><button class="btn ${clients.length?'':'primary'}" data-action="${clients.length?'reset':'add'}">${clients.length?'Reset filters':'＋ Add client'}</button></div>`;
 $('#roster-foot').hidden=!visible.length;$('#roster-foot').innerHTML=`<span>${start+1}–${Math.min(start+perPage,list.length)} of ${list.length} ${filter==='active'?'active ':''}clients</span><div class="pagination"><button data-action="previous" aria-label="Previous page" ${page===1?'disabled':''}>←</button><span>Page ${page} of ${pages}</span><button data-action="next" aria-label="Next page" ${page===pages?'disabled':''}>→</button></div>`;
}
function modal(title,body){if(!$('#modal').open)returnFocus=document.activeElement;$('#modal-content').innerHTML=`<div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="close" aria-label="Close dialog" data-action="close">×</button></div>${body}`;if(!$('#modal').open)$('#modal').showModal()}
function destination(title,url){const clientId=url.includes('clientId=')?new URL(url,location.origin).searchParams.get('clientId'):url.split('/')[2];const c=clients.find(c=>c.id===clientId);let copy='Opens the existing '+title.toLowerCase()+' page.';
 if(title==='Client Overview')copy=`Opens ${c?.name||'this client'}’s Overview, with their daily training, check-in snapshot and review items.`;
 if(title==='Client’s program copy')copy=`Opens ${c?.name||'this client'}’s assigned program for editing. Changes belong to this client’s copy; the library template stays intact.`;
 if(title==='Assign a program')copy=`Opens Programs with ${c?.name||'this client'} selected. Choose a template, weeks and start date, then review conflicts before assigning.`;
 if(url.includes('view=concerns'))copy=`Opens ${c?.name||'this client'}’s Concerns to review the recorded issue and follow-up.`;
 if(url.includes('view=wellness'))copy=`Opens ${c?.name||'this client'}’s Wellness check-ins to review their dated inputs or record a check-in.`;
 if(url.endsWith('#health-screening'))copy=`Opens ${c?.name||'this client'}’s Health screening and clearance record.`;
 if(url.endsWith('#formal-assessments'))copy=`Opens ${c?.name||'this client'}’s formal assessments to record the missing baselines.`;
 if(title==='Booked session completion')copy='Opens this client’s Completion view. The preview count covers past, non-cancelled bookings from 12 Sep–11 Oct; pending bookings remain awaiting a status update.';
 modal(title,`<p class="modal-copy">${esc(copy)}</p><code class="route">${esc(url)}</code><p class="form-note">Destination preview using fictional clients. No app records are changed.</p><div class="modal-foot"><button class="btn primary" data-action="close">Back to roster</button></div>`)
}
function addClient(){modal('Add client',`<form class="form" id="add-client"><label>Client name<input name="name" required maxlength="80" placeholder="Full name"></label><label>Email <span class="form-note">Optional</span><input name="email" type="email" maxlength="120" placeholder="name@example.com"></label><label>Goal <span class="form-note">Optional</span><input name="goal" maxlength="160" placeholder="What are they working towards?"></label><p class="form-note">Creates an active fictional client in this preview only. The app will use its existing Add client form.</p><div class="modal-foot"><button type="button" class="btn" data-action="close">Cancel</button><button type="submit" class="btn primary">Add preview client</button></div></form>`)}
function reset(){filter='active';query='';unassigned=false;page=1;$('#search').value='';$('#unassigned').checked=false;render()}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-route]');if(!b)return;if(b.dataset.route){destination(b.dataset.title,b.dataset.route);return}const action=b.dataset.action;
 if(action==='filter'){filter=b.dataset.value;page=1;render();$(`[data-action="filter"][data-value="${filter}"]`).focus()}else if(action==='reset')reset();else if(action==='clear-search'){query='';$('#search').value='';page=1;render();$('#search').focus()}else if(action==='focus-search'){$('#search').focus();$('#search').scrollIntoView({block:'center',behavior:'smooth'})}else if(action==='next'||action==='previous'){page+=action==='next'?1:-1;render();document.querySelector('.pagination button:not(:disabled)')?.focus({preventScroll:true});$('#list').scrollIntoView({block:'start',behavior:'smooth'})}else if(action==='add')addClient();else if(action==='close')$('#modal').close();else if(action==='home')reset();else if(action==='navigation')modal('Navigation',`<div class="form">${Object.entries(paths).map(([n,p])=>route(n,p,n,'btn')).join('')}</div>`);else if(action==='decisions')modal('A clearer client roster',`<ol class="decisions"><li><strong>Find the right client.</strong> Active clients first, with search, status filters and simple sorting.</li><li><strong>Keep the client central.</strong> Name opens Overview. Program, booking and review links open their specific destination.</li><li><strong>Show why a review is needed.</strong> Specific concerns, screening and dated follow-ups replace broad “At risk” labels. Missing data stays neutral.</li><li><strong>Make programs useful.</strong> See current or upcoming client-owned programs, or assign a program to that client.</li><li><strong>Use honest activity labels.</strong> “Latest record” describes stored observations, not a login. Booked completion uses the past 30 days and excludes future/cancelled appointments.</li><li><strong>Keep mobile complete.</strong> Rows become compact client cards, with program and review details still visible.</li></ol><p class="form-note">The app implementation will reuse the Dashboard’s review rules and include completed workout logs when finding the latest activity. No application code has changed.</p>`)
});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;page=1;render()}});
document.addEventListener('change',e=>{if(e.target.id==='scenario')init(e.target.value);else if(e.target.id==='sort'){sort=e.target.value;page=1;render()}else if(e.target.id==='unassigned'){unassigned=e.target.checked;page=1;render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='add-client')return;e.preventDefault();const f=e.target,v=new FormData(f),name=v.get('name').trim();if(!name){f.elements.name.setCustomValidity('Enter a client name.');f.elements.name.reportValidity();f.elements.name.setCustomValidity('');return}clients.push({id:'preview-'+Date.now(),name,email:v.get('email').trim(),goal:v.get('goal').trim(),status:'Active',program:null,booked:0,completed:0,activity:null,source:null,isNew:true,review:{label:'3 baselines to record',kind:'neutral',detail:'Fitness · movement · body',to:'/assessments#formal-assessments'}});$('#modal').close();filter='active';query=name;page=1;unassigned=false;$('#search').value=name;$('#unassigned').checked=false;render();notify('Client added to this preview only.')});
$('#modal').addEventListener('close',()=>returnFocus?.isConnected&&returnFocus.focus());
init();
})();
</script></body></html>
