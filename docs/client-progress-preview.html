function outcomes(){return `<div class="outcome-grid"><section class="card wide"><div class="row between"><h2>Body measurements</h2>${has()?'<span class="badge">Skinfold · same method</span>':''}</div>${has()?`<div class="compare-head">${limited()?'Baseline: Sep 1':'Sep 1 baseline → Oct 8 latest'}, 2026</div><div class="stats">${stat('Body mass',limited()?'82 <small>kg</small>':'80 <small>kg</small>',limited()?'Baseline only':'82 → 80 kg · −2 kg')}${stat('Body fat',limited()?'22<small>%</small>':'20<small>%</small>',limited()?'Baseline only':'22 → 20% · −2 points')}${stat('Lean mass','64 <small>kg</small>',limited()?'Baseline only':'64 → 64 kg')}</div>${limited()?'<p class="context-note">1 reassessment needed to compare.</p>':''}`:'<div class="outcome-empty">No body measurements recorded.</div>'}<div class="foot"><span>Body composition</span>${go(has()?'Assessment history':'Record baseline','assessments/body_comp')}</div></section><section class="card"><h2>Movement</h2>${has()?`<div class="compare-head">Five-pattern screen · ${limited()?'Sep 1':'Sep 1 → Oct 8'}</div><div class="compare-row"><span>Screen score</span><span>${limited()?'':'8 →'}</span><b>${limited()?'8':'11'} / 15</b></div><p class="context-note">${limited()?'1 reassessment needed to compare.':'Same protocol'}</p>`:'<div class="outcome-empty">No movement screen recorded.</div>'}<div class="foot">${go(has()?'Assessment history':'Record baseline','assessments/movement')}</div></section><section class="card"><h2>Fitness tests</h2>${has()?`<div class="compare-head">${limited()?'Sep 1 baseline':'Sep 1 baseline → Oct 8 latest'}</div><div class="compare-row"><span>Bench press · tested</span><span>${limited()?'':'95 →'}</span><b>${limited()?'95':'100'} kg</b></div><p class="context-note">${limited()?'1 reassessment needed to compare.':'Formal assessment result'}</p>`:'<div class="outcome-empty">No fitness assessment recorded.</div>'}<div class="foot">${go(has()?'Assessment history':'Record baseline','assessments/fitness')}</div></section></div>`;}
function completion(){let long=state.completionDays===90,total=!has()?0:limited()?1:long?30:10,done=!has()?0:limited()?0:long?24:8,miss=!has()||limited()?0:long?3:1,pending=total-done-miss,pct=total?Math.round(done/total*100):0;return `<section class="card"><div class="row between panel-head"><div class="info-row"><h2>Booked session completion</h2>${tip('completion')}</div>${period('completion-period',state.completionDays,[30,90])}</div><div class="rate-layout"><div class="ring" style="--rate:${pct}%"><div><strong>${total?pct+'%':'—'}</strong><small>${total?done+' of '+total+' bookings':'No past bookings'}</small></div></div><div class="rate-counts"><div><strong>${done}</strong><span>Completed</span></div><div><strong>${miss}</strong><span>Missed</span></div><div><strong>${pending}</strong><span>Awaiting status</span></div></div></div><div class="foot"><span>${state.completionDays===30?'Sep 11':'Jul 13'}–Oct 9, 2026 · past bookings</span>${go(pending?'Review booking status':'Open schedule','schedule')}</div></section><section class="card"><div class="record-row"><div><strong>Completed workout logs</strong><small>Counted separately from bookings</small></div><strong style="font-size:28px">${has()?limited()?1:state.completionDays===90?27:9:0}</strong></div><div class="foot"><span>Through Oct 10, 2026</span>${go('View workout history','training#training-history')}</div></section>`;}
const muscleCounts={'Chest':6,'Upper back':6,'Quadriceps':9,'Glutes':6,'Hamstrings':6,'Abdominals':4,'Biceps':3,'Calves':0};
function render(){ $('content').innerHTML=`<div class="page-title"><h1>Progress</h1><button class="btn" data-destination="training">Open Training →</button></div><div class="view-tabs" role="tablist" aria-label="Progress views">${views.map(([id,label])=>`<button role="tab" id="tab-${id}" aria-selected="${state.view===id}" aria-controls="view-panel" tabindex="${state.view===id?0:-1}" data-view="${id}">${label}</button>`).join('')}</div><div id="view-panel" role="tabpanel" aria-labelledby="tab-${state.view}">${({strength, 'training-load':load,outcomes,attendance:completion}[state.view])()}</div>`;$('location').textContent='/clients/:clientId/progress#'+state.view;}
function modal(title,html){returnFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-content').innerHTML=html;$('dialog').showModal();$('close-dialog').focus();}
function destination(dest){if(dest==='progress'){close();render();return;}let route=dest==='overview'?'/clients/:clientId':dest==='report'?'/report/:clientId':dest==='messages'?'/messages?clientId=:clientId':['schedule','clients','workouts','settings','dashboard','concerns'].includes(dest)?'/'+(dest==='dashboard'?'':dest):'/clients/:clientId/'+dest;modal('Go to '+({training:'Training',overview:'Overview',report:'Client report',schedule:'Schedule'}[dest]||dest.split('/')[0]),`<p>This action opens the existing ${dest.startsWith('assessments')?'assessment records':dest.startsWith('training')?'workout calendar and history':dest} screen.</p><code>${esc(route)}</code><p>Navigation preview only. Your client data is unchanged.</p><div class="dialog-foot">${btn('Back to Progress','close',true)}</div>`);}
function close(){$('dialog').close();returnFocus?.focus();}
function metric(m){modal(m+' history',`<div class="row between"><div class="info-row">${tip(m)}<small>Latest 28 days</small></div></div>${chart(!has()||limited()&&m==='ACWR'?[]:m==='ACWR'?[.91,1.02,1.1,Number(derivedValues()[0])]:m==='Monotony'?[.7,.8,.91,Number(derivedValues()[1])]:[640,760,930,Number(derivedValues()[2])],m==='Strain'?'AU':'ratio',{emptyText:limited()?'2 more positive-load days needed':'No '+m+' values yet'})}<p>${info[m]}</p><div class="dialog-foot">${btn('Close','close')}</div>`);}
function record(kind){modal(kind==='max'?'1RM records':kind==='srpe'?'Record session RPE':kind==='resistance'?'Log resistance':'Log conditioning',`<p>Preview of the existing entry flow. Entries here are not saved.</p><form id="sample-form"><div class="form-grid"><label class="field">Date<input type="date" required value="2026-10-10"></label>${kind==='srpe'?'<label class="field">Duration (min)<input type="number" required min="1" value="55"></label><label class="field">Session RPE (0–10)<input type="number" required min="0" max="10" step="0.5" value="6"></label>':kind==='max'?'<label class="field">Lift<select><option>Bench press</option></select></label><label class="field">Coach-entered 1RM (kg)<input type="number" required min="1" value="105"></label>':'<label class="field">'+(kind==='resistance'?'Exercise':'Modality')+'<input required value="'+(kind==='resistance'?'Bench press':'Cycle')+'"></label><label class="field">'+(kind==='resistance'?'Load (kg)':'Duration (min)')+'<input required type="number" min="0" value="30"></label>'}</div><div class="dialog-foot"><button class="btn primary" type="submit">Preview save</button></div></form>`);}
document.addEventListener('click',e=>{const el=e.target.closest('button,a,[data-muscle]');if(!el)return;if(el.dataset.view){state.view=el.dataset.view;history.replaceState(null,'','#'+state.view);render();$('tab-'+state.view).focus();}else if(el.dataset.destination){e.preventDefault();destination(el.dataset.destination);}else if(el.dataset.info){modal('About '+el.dataset.info,`<p>${info[el.dataset.info]}</p><div class="dialog-foot">${btn('Close','close')}</div>`);}else if(el.dataset.chart){state.chart=el.dataset.chart;render();}else if(el.dataset.metric)metric(el.dataset.metric);else if(el.dataset.week){state.week=Math.max(-1,Math.min(0,state.week+Number(el.dataset.week)));render();}else if(el.dataset.volume){state.volume=el.dataset.volume;render();}else if(el.dataset.muscle){const m=el.dataset.muscle;modal(m,`<p>${state.week<0?'Sep 28–Oct 4':'Oct 5–11'}, 2026 · completed working sets</p><h3>${has()?(muscleCounts[m]||0):0} direct sets</h3><p>${has()&&muscleCounts[m]?'Exercise records and actual sets appear in the existing muscle detail view.':'No direct sets recorded.'}</p>${go('View Training','training')}`);}else if(el.dataset.global){destination(el.dataset.global.toLowerCase());}else if(el.dataset.action){const a=el.dataset.action;if(a==='close')close();else if(['max','srpe','resistance','cardio'].includes(a))record(a);else if(a==='srpe-history')modal('Session RPE entries',has()?'<div class="table-scroll"><table><thead><tr><th>Date</th><th>RPE</th><th>Minutes</th><th>Load</th></tr></thead><tbody><tr><td>Oct 8</td><td>6</td><td>55</td><td>330 AU</td></tr></tbody></table></div>':'<p>No session RPE entries.</p>');else if(a==='advanced')modal('Advanced chart options','<p>The existing X-axis, second Y-axis, rolling means and source table stay available here. This preview demonstrates the default date view.</p><p>Separate Y scales are labelled when comparing metrics.</p><div class="dialog-foot">'+btn('Back','close')+'</div>');}});
document.addEventListener('change',e=>{let m={'lift':'lift','load-metric':'loadMetric','load-period':'days','load-style':'style','load-mode':'mode','completion-period':'completionDays','scenario':'scenario'};if(m[e.target.id]){state[m[e.target.id]]=['load-period','completion-period'].includes(e.target.id)?Number(e.target.value):e.target.value;let open=document.querySelector('.settings[open]');render();if(open)document.querySelector('.settings').open=true;}else if(e.target.id==='history-size')render();});
document.addEventListener('submit',e=>{if(e.target.id==='sample-form'){e.preventDefault();close();$('toast').textContent='Preview complete · no client records changed';$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500);}});
document.addEventListener('keydown',e=>{if(e.target.matches('[role="tab"]')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let i=views.findIndex(v=>v[0]===state.view);i=e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4;state.view=views[i][0];history.replaceState(null,'','#'+state.view);render();$('tab-'+state.view).focus();}if(e.target.matches('[data-muscle]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click();}});
$('close-dialog').onclick=close;$('dialog').addEventListener('close',()=>returnFocus?.focus());$('show-changes').onclick=()=>modal('What changes?',`<div class="change-row"><strong>Compact navigation</strong><p>Four existing views become one compact tab row. Remove repeated section titles and numbered labels.</p></div><div class="change-row"><strong>Charts first</strong><p>Strength keeps source-specific metrics. Training load starts with its chart; calculations and the existing muscle map follow.</p></div><div class="change-row"><strong>Stable empty and long states</strong><p>Charts retain their height. Histories have bounded scrolling. Empty states explain only the next useful step.</p></div><div class="change-row"><strong>Existing destinations</strong><p>Training for workouts, Assessments for baseline records, Schedule for booking status. Click a destination to inspect its route.</p></div><div class="change-row"><strong>On-demand detail</strong><p>Info buttons open contained dialogs. Coach entries, advanced chart options and histories remain accessible.</p></div><p>Illustrative data. No calculation changes or app implementation in this preview.</p>`);
$('reset-preview').onclick=()=>{state={...state,view:'strength',scenario:'recorded',lift:'Bench press',chart:'estimate',days:28,week:0,volume:'sets'};$('scenario').value='recorded';$('history-size').value='6';history.replaceState(null,'','#strength');render();};$('search-clients').onclick=()=>destination('clients');$('notifications').onclick=()=>modal('Notifications','<p>Existing notification panel opens here.</p>');window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(views.some(x=>x[0]===v)){state.view=v;render();}});render();
})();
</script></body></html>
