function makeProgram(name,goal,weeks,equipment,level,description,sessions){return{id:id(),name,goal,equipment,level,description,version:1,weeks:Array.from({length:weeks},(_,i)=>freshWeek(sessions).map(s=>({...s,exercises:s.exercises.map(e=>({...e,rir:i<2?3:e.rir}))}))),progression:'Build reps within the range at the target RIR, then increase load. Review recovery before adding sets.'}}

makeProgram('Five-day Hypertrophy','Hypertrophy',8,'Full gym','Intermediate','Legs, push, pull, lower and upper. Two planned rest days.',[session('Legs A',0,[0,1,3,4]),session('Push',1,[5,6,8,9]),session('Pull',2,[10,11,12,13]),session('Lower B',4,[2,14,3,16]),session('Upper B',5,[6,17,10,8,13])]),

library[4].weeks.forEach(w=>w.forEach((s,i)=>s.exercises.forEach((e,j)=>{if(j<2){e.min=i===2?6:3;e.max=i===2?8:5;e.loadType='Percent 1RM';e.percent=i===2?70:80;e.rest=180}})));
page='library';editor=null;dirty=false;filter={q:'',days:'all',goal:'all'};clientId='alex';calendarWeek='2026-10-12';selectedDate=calendarWeek;render();}

function modal(title,body,wide=false){returnFocus=document.activeElement;$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').classList.toggle('wide',wide);if(!$('#modal').open)$('#modal').showModal()}

$('#modal').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
function navigate(target){if(dirty){modal('Leave unsaved changes?',`<p class="form-note">Your edits have not been saved to this ${editor.kind==='template'?'template':'client copy'}.</p><div class="modal-foot">${button('Keep editing','close')}${button('Discard changes','discard','','data-target="'+target+'"')}</div>`);return}page=target;render();window.scrollTo(0,0)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===(page==='training'?'training':'library')));if(page==='library')renderLibrary();else if(page==='editor')renderEditor();else renderTraining()}

function prescription(e){return `${e.sets} × ${e.min===e.max?e.min:e.min+'–'+e.max} reps${e.loadType==='Percent 1RM'?' · '+e.percent+'% 1RM':''} · ${e.rir} RIR`}

function workload(week){const totals={};week.forEach(s=>s.exercises.forEach(e=>(catalog.find(x=>x[0]===e.name)?.[2]||'Unmapped').split(', ').forEach(m=>totals[m]=(totals[m]||0)+e.sets)));return Object.entries(totals).map(([m,n])=>`<span>${esc(m)} <strong>${n} sets</strong></span>`).join('')}
function renderEditor(){const p=editor.data,w=p.weeks[selectedWeek];selectedSession=Math.min(selectedSession,w.length-1);const s=w[selectedSession],copy=editor.kind==='copy',owner=copy?clients.find(c=>c.id===p.clientId):null;$('#content').innerHTML=`<button class="link back" data-action="${copy?'training':'library'}">← ${copy?'Client Training':'Programs'}</button><div class="page-head"><div><div class="row" style="margin-bottom:8px"><span class="badge ${copy?'green':''}">${copy?'Client copy · '+esc(owner.name):'Library template'}</span><small>${copy?'Copied from version '+p.sourceVersion:'Version '+p.version}</small></div><h1>${esc(p.name)}</h1><p>${p.weeks.length} weeks · ${p.weeks[0].length} training days / week · ${esc(p.equipment)}</p></div><div class="actions">${button('Program settings','settings')}${!copy?button('Assign to client','assign','primary'):''}</div></div>${copy?'<div class="copy-context">Edits apply to '+esc(owner.name)+' only. The library template stays unchanged.</div>':''}<section class="card hero"><div><span class="eyebrow">${esc(p.goal)}</span><h2>${copy?'Make it fit the client':'A repeatable split. Room to adapt.'}</h2><p>${esc(p.description)}</p></div><div class="hero-stat"><strong>${p.weeks.reduce((n,w)=>n+w.length,0)}</strong><small>planned sessions</small></div></section><div class="week-bar"><nav class="week-nav" aria-label="Program weeks">${p.weeks.map((_,i)=>`<button data-action="week" data-index="${i}" class="${i===selectedWeek?'active':''}" ${i===selectedWeek?'aria-current="true"':''}>Week ${i+1}</button>`).join('')}</nav>${!copy?button('Copy week…','copy-week','small'):''}</div><div class="editor-grid"><nav class="session-nav" aria-label="Sessions in week ${selectedWeek+1}">${w.map((s,i)=>`<button data-action="session" data-index="${i}" class="${i===selectedSession?'active':''}" ${i===selectedSession?'aria-current="true"':''}><span class="session-index">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(s.name)}</strong><small>${copy?shortDate(s.date):days[s.day]} · ${s.exercises.length} exercises</small></span></button>`).join('')}</nav><section class="card session-card"><div class="section-head"><div><span class="eyebrow">Week ${selectedWeek+1} · ${copy?fmt(s.date):days[s.day]}</span><h2 style="margin-top:4px">${esc(s.name)}</h2><p>${s.exercises.length} exercises · ${s.exercises.reduce((n,e)=>n+e.sets,0)} working sets</p></div>${button('Edit session','edit-session','small')}</div><div>${rows(s)}</div><div class="session-foot">${button('＋ Add exercise','add-ex','small')}<small>Warm-up sets are additional</small></div></section></div><details class="details"><summary>Weekly workload & progression</summary><div class="details-body"><div class="workload">${workload(w)}</div><p>Direct working sets in this preview. Assisting work is not included; these totals are planning estimates.</p><p>${esc(p.progression)}</p><p>Early weeks start at 3 RIR; later weeks default to 2 RIR. Both are editable coaching choices.</p></div></details><div class="sticky-save"><small>${dirty?'Unsaved preview changes':copy?'Client-owned copy':'Template edits do not update assigned copies'}</small><div class="actions">${button('Save '+(copy?'client copy':'template'),'save','primary')}</div></div>`;}
function saveEditor(){const p=editor.data;if(p.weeks.some(w=>w.some(s=>!s.exercises.length))){notify('Add at least one exercise to each session before saving.');return false}const collection=editor.kind==='template'?library:assignments;const index=collection.findIndex(x=>x.id===p.id);if(editor.kind==='template'&&dirty)p.version++;if(index>=0)collection[index]=clone(p);else collection.push(clone(p));dirty=false;render();notify(editor.kind==='template'?'Template saved in preview. Client copies are unchanged.':'Client copy saved in preview. Library template unchanged.');return true}
function settings(){const p=editor.data;modal('Program settings',`<form id="settings-form"><div class="form-grid">${input('name','Program name',p.name,'text','required maxlength="90"')}<label class="field">Goal${select('goal',['General fitness','Strength & muscle','Hypertrophy','Strength'].map(x=>[x,x]),p.goal)}</label>${input('equipment','Equipment',p.equipment,'text','required')}<label class="field">Experience${select('level',['Beginner','Intermediate','All levels'].map(x=>[x,x]),p.level)}</label><label class="field full">Description<textarea name="description" maxlength="180">${esc(p.description)}</textarea></label><label class="field full">Progression guidance<textarea name="progression" required>${esc(p.progression)}</textarea></label></div><div class="modal-foot">${button('Cancel','close')}<button class="btn primary" type="submit">Apply changes</button></div></form>`)}
function exerciseForm(index=null){const s=editor.data.weeks[selectedWeek][selectedSession],e=index===null?ex(0):s.exercises[index];modal(index===null?'Add exercise':'Edit exercise',`<form id="exercise-form" data-index="${index??''}"><div class="form-grid"><label class="field full">Exercise${select('name',catalog.map(x=>[x[0],x[0]]),e.name)}</label>${input('sets','Working sets',e.sets,'number','min="1" max="10" required')}${input('rir','Target RIR',e.rir,'number','min="0" max="10" required')}${input('min','Reps — minimum',e.min,'number','min="1" max="50" required')}${input('max','Reps — maximum',e.max,'number','min="1" max="50" required')}<label class="field">Load prescription${select('loadType',['Effort only','Percent 1RM'].map(x=>[x,x]),e.loadType,'id="load-type"')}</label>${input('rest','Rest (seconds)',e.rest,'number','min="0" max="600" step="15" required')}<div id="percent-field" ${e.loadType==='Percent 1RM'?'':'hidden'}>${input('percent','% of client 1RM',e.percent,'number','min="1" max="100" required')}</div></div><p class="form-note" style="margin-top:15px;margin-bottom:0">RIR = estimated reps remaining. Percentage targets use the assigned client’s strength reference.</p><p class="error" id="form-error" role="alert"></p><div class="modal-foot">${index!==null?button('Remove exercise','remove-ex','left','data-index="'+index+'"'):''}${button('Cancel','close')}<button class="btn primary" type="submit">${index===null?'Add exercise':'Apply changes'}</button></div></form>`)}
function editSession(){const s=editor.data.weeks[selectedWeek][selectedSession],copy=editor.kind==='copy';modal('Edit session',`<form id="session-form"><div class="form-grid">${input('name','Session name',s.name,'text','required maxlength="70"')}${copy?`<label class="field">Scheduled date<input value="${fmt(s.date)}" disabled><small>Rescheduling will live in the client calendar.</small></label>`:`<label class="field">Suggested weekday${select('day',days.map((d,i)=>[i,d]),s.day)}</label>`}</div><p class="error" id="form-error" role="alert"></p><div class="modal-foot">${button('Cancel','close')}<button class="btn primary" type="submit">Apply changes</button></div></form>`)}

function startAssign(){if(dirty){notify('Save your template changes before assigning.');return}assign={step:1,program:clone(editor.data),clientId,start:'2026-10-12',from:1,to:editor.data.weeks.length,mapping:editor.data.weeks[0].map(s=>s.day),conflicts:true,accepted:false};renderAssign()}

function renderAssign(){const a=assign,p=a.program,client=clients.find(c=>c.id===a.clientId);let body=`<div class="stepper"><span class="${a.step===1?'active':''}">1 · Client & weeks</span><span class="${a.step===2?'active':''}">2 · Training days</span><span class="${a.step===3?'active':''}">3 · Review</span></div>`;

if(a.step===3){const dates=targets(),conf=clashes(),blocked=conf.filter(c=>c.status!=='planned'),percent=dates.some(t=>t.session.exercises.some(e=>e.loadType==='Percent 1RM'));body+=`<div class="review-grid"><div><small>Client copy</small><strong>${esc(client.name)}</strong></div><div><small>Schedule</small><strong>${a.to-a.from+1} weeks · ${dates.length} sessions</strong></div><div><small>First session</small><strong>${fmt(dates[0].date)}</strong></div><div><small>Last session</small><strong>${fmt(dates.at(-1).date)}</strong></div></div><details class="details" style="margin-bottom:15px"><summary>View dated sessions</summary><div class="details-body schedule-review">${dates.map(t=>`<div class="schedule-row"><span>${shortDate(t.date)} · W${t.week}</span><strong>${esc(t.name)}</strong></div>`).join('')}</div></details><label class="check"><input type="checkbox" id="demo-conflicts" ${a.conflicts?'checked':''}>Preview scenario: existing workouts on 12 & 14 October</label>${conf.length?`<div class="notice-box amber"><strong>${conf.length} schedule conflict${conf.length===1?'':'s'}</strong>${conf.map(c=>`<p style="margin-top:6px">${shortDate(c.date)} · ${esc(c.name)}${c.status!=='planned'?' — protected':''}</p>`).join('')}</div>${blocked.length?'<p class="error">Started workouts and existing program assignments are protected. Change the start week or training days.</p>':'<label class="check"><input type="checkbox" id="replace-confirm" '+(a.accepted?'checked':'')+'>Replace the listed unstarted session with this program.</label>'}`:'<div class="notice-box">No schedule conflicts. Ready to create the client copy.</div>'}${percent?`<p class="form-note">${client.tm?'Percentage targets will use this client’s exercise-specific 1RM records.':'1RM references are missing. Percentage targets will remain unresolved until the coach adds a reference or changes the load prescription.'}</p>`:''}<p class="form-note">Template: ${esc(p.name)} · version ${p.version}. Later template edits do not change this assignment.</p><div class="modal-foot">${button('← Back','assign-back')}${button('Create client copy','confirm-assign','primary',blocked.length||conf.length&&!a.accepted?'disabled':'')}</div>`;}
modal('Assign '+p.name,body,true)}
function confirmAssign(){if(clashes().some(c=>c.status!=='planned')||(clashes().length&&!assign.accepted))return;const a=assign,p=clone(a.program);p.id=id();p.clientId=a.clientId;p.sourceId=a.program.id;p.sourceVersion=a.program.version;p.start=a.start;p.sourceFrom=a.from;p.weeks=p.weeks.slice(a.from-1,a.to).map((w,wi)=>freshWeek(w).map((s,si)=>({...s,day:a.mapping[si],date:addDays(a.start,wi*7+a.mapping[si])})));assignments.push(p);clientId=p.clientId;calendarWeek=p.start;selectedDate=targets()[0].date;const c=clients.find(c=>c.id===p.clientId);modal('Program assigned',`<div class="success"><div class="success-mark">✓</div><h2>${esc(c.name)} has their own copy</h2><p>${esc(p.name)} · ${p.weeks.length} weeks<br>${fmt(p.start)} – ${fmt(addDays(p.start,p.weeks.length*7-1))}</p><span class="badge green">Library template unchanged</span></div><div class="modal-foot">${button('Back to template','close')}${button('Open client Training →','assigned-training','primary')}</div>`)}
function renderTraining(){const c=clients.find(c=>c.id===clientId),owned=assignments.filter(a=>a.clientId===clientId),sessions=owned.flatMap(a=>a.weeks.flat().map(s=>({...s,assignmentId:a.id}))),active=sessions.find(s=>s.date===selectedDate);$('#content').innerHTML=`<div class="client-head"><span class="avatar">${c.initials}</span><div><h2>${c.name}</h2><p>${c.note}</p></div></div><div class="client-tabs" aria-label="Client sections">${['Overview','Training','Progress','Check-ins','Assessments','Profile'].map(t=>`<button class="${t==='Training'?'active':''}" ${t==='Training'?'aria-current="page"':'data-action="client-destination" data-page="'+t+'"'}>${t}</button>`).join('')}</div><div class="page-head"><h1>Training</h1><div class="selection-row"><label class="field">Preview client${select('client-switch',clients.map(c=>[c.id,c.name]),clientId,'id="client-switch"')}</label></div></div><div class="assignment-list">${owned.map(a=>`<section class="card assignment-card"><div><span class="eyebrow">Assigned program · Client copy</span><h3>${esc(a.name)}</h3><p>${fmt(a.start)} – ${fmt(addDays(a.start,a.weeks.length*7-1))} · ${a.weeks.length} weeks</p></div><div class="actions">${button('Open program','open-copy','primary','data-id="'+a.id+'"')}</div></section>`).join('')||`<section class="card assignment-card"><div><span class="eyebrow">Assigned program</span><h3>No program assigned</h3></div>${button('Browse programs →','library','primary')}</section>`}</div>${owned.length?`<div class="between" style="margin-bottom:14px"><small>${owned.length} independent program ${owned.length===1?'copy':'copies'}</small><button class="link" data-action="library">Programs library →</button></div>`:''}<section class="card"><div class="between calendar-head"><h2>Workout calendar</h2><div class="actions">${button('←','calendar-prev','small','aria-label="Previous week"')}<span style="font-size:12px">${shortDate(calendarWeek)} – ${shortDate(addDays(calendarWeek,6))}</span>${button('→','calendar-next','small','aria-label="Next week"')}</div></div><div class="calendar">${days.map((d,i)=>{const date=addDays(calendarWeek,i),s=sessions.find(s=>s.date===date);return`<button class="cal-day ${selectedDate===date?'selected':''}" data-action="calendar-day" data-date="${date}" aria-label="${d} ${shortDate(date)}: ${esc(s?.name||'No assigned session')}" ${selectedDate===date?'aria-pressed="true"':'aria-pressed="false"'}><span class="dow">${d.slice(0,3)}</span><span class="date">${+date.slice(-2)}</span>${s?'<strong>'+esc(s.name)+'</strong>':'<small>—</small>'}</button>`}).join('')}</div><div class="calendar-session"><div class="section-head"><div><span class="eyebrow">${fmt(selectedDate)}</span><h3 style="margin-top:5px">${esc(active?.name||'No session assigned')}</h3></div>${active?button('Edit session','training-edit','primary','data-id="'+active.assignmentId+'" data-session="'+active.id+'"'):''}</div>${active?rows(active,false):'<p>Choose a planned day to review its exercises.</p>'}</div></section><details class="details history"><summary>Session history</summary><div class="details-body">Existing workout history stays here. Assigning a program adds prescriptions, not completed workout logs.</div></details>`;}
function evidence(){modal('Evidence behind the templates',`<p class="form-note">Research informs the programming principles. These exact sample routines have not been clinically validated.</p><ol class="source-list"><li><a href="https://pubmed.ncbi.nlm.nih.gov/41843416/" target="_blank" rel="noopener">ACSM position stand, 2026</a><br>Progressive resistance training, goal-specific loading and volume.</li><li><a href="https://pubmed.ncbi.nlm.nih.gov/38595233/" target="_blank" rel="noopener">Split versus full-body routines, 2024</a><br>No clear advantage when weekly volume is matched.</li><li><a href="https://link.springer.com/article/10.1007/s40279-025-02344-w" target="_blank" rel="noopener">Volume and frequency dose response, 2026</a><br>Increasing volume has diminishing returns; direct and indirect work differ.</li><li><a href="https://link.springer.com/article/10.1007/s40279-024-02069-2" target="_blank" rel="noopener">Proximity to failure, 2024</a><br>RIR informs effort, with uncertainty around an exact optimum.</li></ol><p class="form-note">Week counts, exercise choices and the 3-to-2 RIR default are editable coaching choices. This preview uses sample prescriptions to demonstrate the workflow.</p><div class="modal-foot">${button('Close','close')}</div>`)}
function criteria(){modal('Design decisions for the build',`<ol class="criteria"><li><strong>Programs replaces Workout Plans.</strong> Exercise library remains a separate tab.</li><li><strong>Program → weeks → sessions → exercises.</strong> Reuse the existing day builder for prescriptions.</li><li><strong>Assignment makes an independent copy.</strong> Keep template ID and version for provenance; never automatically synchronize edits.</li><li><strong>Coach chooses weekdays and start week.</strong> Preview all dated sessions and conflicts before assigning.</li><li><strong>Protect started and completed workouts.</strong> Unstarted plans need explicit replacement approval.</li><li><strong>Preserve existing plans.</strong> Convert legacy exercise lists without inventing a missing weekly split.</li><li><strong>Prescriptions support rep ranges, %1RM and RIR.</strong> Calculate load using each client’s own reference.</li><li><strong>Keep the calendar and workout runner.</strong> A program adds structure to the existing Training workflow.</li></ol><div class="notice-box">Preview scope: library, week/day editing, copying a week, client assignment and client-only edits. No app or backend records are changed.</div><div class="modal-foot">${button('Close','close')}</div>`)}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='close'){close();return}if(a==='library'||a==='training'){navigate(a);return}if(a==='discard'){dirty=false;close();navigate(b.dataset.target);return}if(a==='reset'){modal('Reset preview?',`<p class="form-note">Clear sample edits and client assignments from this preview.</p><div class="modal-foot">${button('Cancel','close')}${button('Reset','confirm-reset','primary')}</div>`);return}if(a==='confirm-reset'){close();init();notify('Preview reset.');return}
if(a==='criteria')criteria();else if(a==='evidence')evidence();else if(a==='open')openProgram(b.dataset.id);else if(a==='open-copy')openProgram(b.dataset.id,'copy');else if(a==='week'){selectedWeek=+b.dataset.index;selectedSession=0;renderEditor()}else if(a==='session'){selectedSession=+b.dataset.index;renderEditor()}else if(a==='settings')settings();else if(a==='edit-ex')exerciseForm(+b.dataset.index);else if(a==='add-ex')exerciseForm();else if(a==='remove-ex'){editor.data.weeks[selectedWeek][selectedSession].exercises.splice(+b.dataset.index,1);dirty=true;close();renderEditor()}else if(a==='edit-session')editSession();else if(a==='copy-week')copyWeek();else if(a==='save')saveEditor();else if(a==='new')newProgram();else if(a==='assign')startAssign();else if(a==='assign-back'){assign.step--;renderAssign()}else if(a==='confirm-assign')confirmAssign();else if(a==='assigned-training'){close();page='training';render();window.scrollTo(0,0)}else if(a==='calendar-prev'||a==='calendar-next'){calendarWeek=addDays(calendarWeek,a==='calendar-prev'?-7:7);selectedDate=calendarWeek;renderTraining()}else if(a==='calendar-day'){selectedDate=b.dataset.date;renderTraining()}else if(a==='training-edit'){openProgram(b.dataset.id,'copy');const p=editor.data;selectedWeek=p.weeks.findIndex(w=>w.some(s=>s.id===b.dataset.session));selectedSession=p.weeks[selectedWeek].findIndex(s=>s.id===b.dataset.session);renderEditor()}else if(a==='exercise-library')modal('Exercise library',`<p class="form-note">The existing exercise catalog stays in its own tab. The program editor selects exercises from that same catalog.</p><div class="modal-foot">${button('Stay in preview','close')}<a class="btn primary" href="/workouts" target="_blank" rel="noopener">Open current Workouts ↗</a></div>`);else if(a==='client-destination')modal(b.dataset.page,`<p class="form-note">This opens the client’s existing ${esc(b.dataset.page)} tab. The Programs redesign keeps that destination unchanged.</p><div class="modal-foot">${button('Close','close')}</div>`);
});
document.addEventListener('input',ev=>{if(ev.target.id==='program-search'){const cursor=ev.target.selectionStart;filter.q=ev.target.value;renderLibrary();$('#program-search').focus();$('#program-search').setSelectionRange(cursor,cursor)}});
document.addEventListener('change',ev=>{const e=ev.target;if(e.id==='days-filter'){filter.days=e.value;renderLibrary()}else if(e.id==='goal-filter'){filter.goal=e.value;renderLibrary()}else if(e.id==='client-switch'){clientId=e.value;renderTraining()}else if(e.id==='load-type')$('#percent-field').hidden=e.value!=='Percent 1RM';else if(e.id==='demo-conflicts'){assign.conflicts=e.checked;assign.accepted=false;renderAssign()}else if(e.id==='replace-confirm'){assign.accepted=e.checked;renderAssign()}else if(e.closest('#assign-two')){const mapping=[...$('#assign-two').querySelectorAll('select')].map(s=>+s.value);$('#rest-note').textContent='Rest days: '+days.filter((_,i)=>!mapping.includes(i)).join(', ')}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,v=new FormData(f);if(f.id==='settings-form'){Object.assign(editor.data,Object.fromEntries(v));dirty=true;close();renderEditor()}else if(f.id==='exercise-form'){if(+v.get('max')<+v.get('min')){$('#form-error').textContent='Maximum reps must be at least the minimum.';return}const e={id:id(),name:v.get('name'),sets:+v.get('sets'),min:+v.get('min'),max:+v.get('max'),rir:+v.get('rir'),rest:+v.get('rest'),loadType:v.get('loadType'),percent:+v.get('percent')},list=editor.data.weeks[selectedWeek][selectedSession].exercises;if(f.dataset.index==='')list.push(e);else list[+f.dataset.index]={...e,id:list[+f.dataset.index].id};dirty=true;close();renderEditor()}else if(f.id==='session-form'){const week=editor.data.weeks[selectedWeek];if(v.has('day')&&week.some((s,i)=>i!==selectedSession&&s.day===+v.get('day'))){$('#form-error').textContent='Another session already uses this weekday.';return}Object.assign(week[selectedSession],{name:v.get('name').trim(),...(v.has('day')?{day:+v.get('day')}:{})});dirty=true;close();renderEditor()}else if(f.id==='copy-form'){const weeks=v.getAll('weeks').map(Number);if(!weeks.length){$('#form-error').textContent='Select at least one destination week.';return}weeks.forEach(i=>editor.data.weeks[i]=freshWeek(editor.data.weeks[selectedWeek]));dirty=true;close();renderEditor();notify('Copied to '+weeks.length+' weeks. Save the template to keep these edits.')}else if(f.id==='new-form'){const n=+v.get('days'),map={2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]}[n];editor={kind:'template',data:makeProgram(v.get('name').trim(),v.get('goal'),+v.get('weeks'),'Full gym','All levels','Coach-created program',map.map((d,i)=>session('Session '+(i+1),d,[])))};selectedWeek=0;selectedSession=0;dirty=true;page='editor';close();render()}else if(f.id==='assign-one'){const start=v.get('start');if(+v.get('to')<+v.get('from')){$('#form-error').textContent='The last week must be on or after the first week.';return}if(weekStart(start)!==start){$('#form-error').textContent='Choose a Monday for the start of the week. Training days are selected next.';return}Object.assign(assign,{clientId:v.get('client'),start,from:+v.get('from'),to:+v.get('to'),step:2,accepted:false});renderAssign()}else if(f.id==='assign-two'){const map=assign.program.weeks[assign.from-1].map((_,i)=>+v.get('day-'+i));if(new Set(map).size!==map.length){$('#form-error').textContent='Choose a different weekday for each session.';return}if(map.some((d,i)=>i>0&&d<=map[i-1])){$('#form-error').textContent='Keep the session order within the week. Choose later weekdays for later sessions.';return}Object.assign(assign,{mapping:map,step:3,accepted:false});renderAssign()}});
init();
})();
</script></body></html>
